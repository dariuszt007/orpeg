<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fa">
  <title>カレンダー / Kalendarz lekcji</title>

  <style>
    :root {
      --bg:#f5f6fa;
      --card:#fff;
      --text:#202437;
      --muted:#687087;
      --line:#e2e5ed;
      --primary:#5147e8;
      --primary-soft:#eeedff;
      --green:#168451;
      --red:#bd3045;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); }
    button,input,select,textarea { font:inherit; }
    button {
      min-height:42px; padding:8px 12px; border:1px solid var(--line);
      border-radius:10px; background:#fff; color:var(--text); cursor:pointer;
      touch-action:manipulation;
    }
    button.primary { background:var(--primary); color:white; border-color:var(--primary); }
    button.danger { color:var(--red); }
    button.active { color:var(--primary); background:var(--primary-soft); }
    input,select,textarea {
      width:100%; min-height:42px; padding:8px 10px;
      border:1px solid var(--line); border-radius:9px; background:white; color:var(--text);
    }
    input[type="checkbox"] { width:20px; min-height:20px; }
    input[type="color"] { padding:4px; }
    textarea { min-height:90px; }
    label { display:block; margin:8px 0 5px; color:var(--muted); font-size:13px; }
    h1,h2,h3 { margin:0 0 10px; }
    h1 { font-size:clamp(21px,5vw,28px); }
    h2 { font-size:20px; }
    h3 { font-size:16px; }
    .app { max-width:1000px; margin:auto; padding:14px; }
    .topbar,.toolbar,.row,.actions { display:flex; align-items:center; gap:8px; }
    .topbar { justify-content:space-between; margin-bottom:14px; }
    .toolbar { flex-wrap:wrap; margin-bottom:12px; }
    .period { flex:1; text-align:center; font-weight:700; }
    .views { display:flex; gap:5px; }
    .card,.calendar { background:var(--card); border:1px solid var(--line); border-radius:15px; }
    .calendar { overflow:hidden; }
    .weekdays,.month-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
    .weekday { padding:8px 2px; text-align:center; color:var(--muted); background:#fafaff; border-bottom:1px solid var(--line); font-size:12px; }
    .month-day {
      min-width:0; min-height:78px; padding:4px 3px; display:flex; flex-direction:column;
      gap:3px; border:0; border-right:1px solid var(--line);
      border-bottom:1px solid var(--line); border-radius:0; background:white;
    }
    .month-day:nth-child(7n) { border-right:0; }
    .month-day.outside { background:#fafbfe; color:#a3a8b5; }
    .month-day.selected { background:var(--primary-soft); }
    .month-day.today .day-num { background:var(--primary); color:white; }
    .day-head { display:flex; justify-content:space-between; align-items:center; }
    .day-num,.add-day { min-height:26px; width:28px; padding:0; border:0; background:transparent; }
    .day-num { border-radius:50%; font-weight:700; }
    .add-day { color:var(--primary); font-size:19px; }
    .month-events { display:grid; gap:3px; }
    .month-event {
      width:100%; min-height:21px; overflow:hidden; padding:3px;
      border:0; border-left:3px solid var(--event-color,var(--primary));
      border-radius:4px; background:color-mix(in srgb,var(--event-color,var(--primary)) 16%,white);
      text-align:left; font-size:10px; font-weight:700;
      white-space:nowrap; text-overflow:ellipsis;
    }
    .section-heading { display:flex; justify-content:space-between; align-items:center; margin:16px 2px 9px; }
    .section-heading h2 { margin:0; }
    .event-list,.week-days { display:grid; gap:8px; }
    .day-card { padding:11px; border:1px solid var(--line); border-radius:13px; background:white; }
    .day-card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .lesson-card {
      padding:9px; border-left:6px solid var(--lesson-color,var(--primary));
      border-radius:9px; background:color-mix(in srgb,var(--lesson-color,var(--primary)) 9%,white);
    }
    .lesson-main { width:100%; min-height:36px; padding:0; border:0; background:transparent; text-align:left; }
    .lesson-line { display:flex; justify-content:space-between; gap:8px; font-weight:700; }
    .muted { color:var(--muted); font-size:13px; }
    .attendance { margin-top:6px; }
    .hidden { display:none!important; }
    .empty { padding:14px; border:1px dashed var(--line); border-radius:10px; color:var(--muted); text-align:center; }

    .week-scroll { overflow:auto; border-radius:12px; background:white; }
    .week-grid { display:grid; grid-template-columns:48px repeat(7,128px); min-width:944px; }
    .week-head { position:sticky; top:0; z-index:2; min-height:48px; padding:6px; border:1px solid var(--line); background:#fafaff; text-align:center; font-size:12px; }
    .time-axis,.week-column {
      position:relative; height:1344px;
      background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 55px,var(--line) 55px,var(--line) 56px);
    }
    .time-axis { position:sticky; left:0; z-index:1; background-color:#fafaff; }
    .hour-label { position:absolute; right:3px; transform:translateY(-7px); color:var(--muted); font-size:10px; }
    .week-column { border-right:1px solid var(--line); background-color:white; }
    .week-event {
      position:absolute; left:3px; right:3px; height:42px; overflow:hidden; padding:4px;
      border:0; border-left:4px solid var(--event-color,var(--primary)); border-radius:6px;
      background:color-mix(in srgb,var(--event-color,var(--primary)) 18%,white);
      text-align:left; font-size:10px;
    }
    .week-event strong,.week-event span { display:block; }
    .month-event,.week-event,.lesson-main { touch-action:none; cursor:grab; }
    .drag-ghost {
      position:fixed; z-index:9999; pointer-events:none; padding:8px 10px;
      border-left:5px solid var(--drag-color,var(--primary)); border-radius:8px;
      background:white; box-shadow:0 5px 20px #0003; font-size:13px; font-weight:700;
      transform:translate(10px,10px);
    }
    .drag-over { outline:3px dashed var(--primary)!important; outline-offset:-4px; background-color:var(--primary-soft)!important; }
    .week-drop-preview {
      position:absolute; z-index:10; left:3px; right:3px; min-height:42px;
      pointer-events:none; padding:5px; border:2px dashed var(--primary); border-radius:7px;
      background:#eeedffdd; color:#3029a8; font-size:11px; font-weight:700;
    }

    .admin-card { margin:12px 0; padding:14px; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    .stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:10px 0; }
    .stat { padding:9px; border-radius:9px; background:#f5f6fb; font-size:13px; }
    .subject-row,.lesson-admin-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
    .subject-row:last-child,.lesson-admin-row:last-child { border-bottom:0; }
    .row-info { min-width:0; overflow-wrap:anywhere; }
    .row-actions { display:flex; gap:5px; flex-shrink:0; }
    .row-actions button { min-height:36px; padding:5px 8px; }
    .lesson-row-main { display:flex; align-items:center; gap:9px; min-width:0; }
    .bulk-actions { display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin:9px 0; }
    .bulk-select-label { display:flex; align-items:center; gap:7px; margin:0; }
    .bulk-select-label input { width:20px; min-height:20px; }
    .table-wrap { overflow:auto; }
    table { width:100%; min-width:420px; border-collapse:collapse; }
    th,td { padding:8px; border:1px solid #ddd; text-align:left; font-size:14px; }
    th { background:#f1f2f6; }
    dialog { width:min(540px,calc(100% - 20px)); max-height:88vh; overflow:auto; padding:17px; border:1px solid var(--line); border-radius:16px; }
    dialog::backdrop { background:#13172788; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
    .check-row { display:flex; align-items:center; gap:8px; }
    .check-row input { width:20px; min-height:20px; }

    @media(min-width:720px) {
      .app { padding:22px; }
      .stats { grid-template-columns:repeat(3,minmax(0,1fr)); }
    }
    @media(max-width:430px) {
      .app { padding:9px; }
      .month-day { min-height:66px; padding:3px 2px; }
      .month-event { font-size:9px; }
      .form-grid { grid-template-columns:1fr; gap:3px; }
      .subject-row,.lesson-admin-row { align-items:flex-start; flex-direction:column; }
    }
  </style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <h1 data-i18n="appTitle">Kalendarz lekcji</h1>
    <button id="adminToggle" class="primary" data-i18n="admin">Panel Admin</button>
  </header>

  <main id="calendarView">
    <div class="toolbar">
      <button id="prevBtn" data-i18n="back">Wstecz</button>
      <button id="todayBtn" data-i18n="today">Dziś</button>
      <button id="nextBtn" data-i18n="next">Dalej</button>
      <div id="periodLabel" class="period"></div>
      <div class="views">
        <button id="monthBtn" class="active" data-i18n="month">Miesiąc</button>
        <button id="weekBtn" data-i18n="week">Tydzień</button>
      </div>
    </div>

    <section id="monthView" class="calendar"></section>
    <section id="monthAgenda">
      <div class="section-heading">
        <h2 id="selectedDateTitle"></h2>
        <span id="selectedDateCount" class="muted"></span>
      </div>
      <div id="selectedDayLessons" class="event-list"></div>
    </section>
    <section id="weekView" class="hidden"></section>
    <p id="loadMessage" class="muted"></p>
  </main>

  <main id="adminView" class="hidden">
    <div class="row" style="justify-content:space-between">
      <h2 data-i18n="admin">Panel Admin</h2>
      <button id="backCalendarBtn" data-i18n="calendar">Kalendarz</button>
    </div>

    <section class="card admin-card">
      <h3 id="subjectFormTitle" data-i18n="addSubject">Dodaj przedmiot</h3>
      <input id="subjectId" type="hidden">
      <div class="form-grid">
        <div>
          <label data-i18n="subjectNameLabel" for="subjectName">Nazwa przedmiotu</label>
          <input id="subjectName" maxlength="60">
        </div>
        <div>
          <label data-i18n="color" for="subjectColor">Kolor</label>
          <input id="subjectColor" type="color" value="#5147e8">
        </div>
        <div>
          <label data-i18n="plannedLessons" for="subjectPlanned">Plan lekcji na rok szkolny</label>
          <input id="subjectPlanned" type="number" min="0" value="0">
        </div>
        <div>
          <label data-i18n="grade" for="subjectGrade">Klasa</label>
          <select id="subjectGrade">
            <option value="" data-i18n="unassigned">Nieprzypisana</option>
            <option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option>
            <option value="5">5</option><option value="6">6</option>
            <option value="7">7</option><option value="8">8</option>
          </select>
        </div>
      </div>
      <div class="actions" style="margin-top:10px">
        <button id="saveSubjectBtn" class="primary" data-i18n="addSubject">Dodaj przedmiot</button>
        <button id="cancelSubjectEditBtn" class="hidden" data-i18n="cancel">Anuluj</button>
      </div>
      <div id="subjectList"></div>
    </section>

    <section class="card admin-card">
      <h3 data-i18n="timezoneTitle">Strefa czasowa</h3>
      <label data-i18n="timezoneLabel" for="displayZone">Strefa wyświetlania</label>
      <select id="displayZone"></select>
      <button id="saveDisplayZoneBtn" class="primary" data-i18n="saveTimezone">Zapisz strefę</button>
      <p class="muted" data-i18n="tokyoDefault">Domyślna strefa: Tokio (Asia/Tokyo).</p>
    </section>

    <section class="card admin-card">
      <h3 data-i18n="attendanceTitle">Obecności</h3>
      <label data-i18n="attendanceFilterLabel" for="attendanceFilter">Filtr przedmiotu</label>
      <select id="attendanceFilter"></select>
      <div id="overallStats" class="stats"></div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th data-i18n="lessonNumber">Numer lekcji</th>
            <th data-i18n="subject">Przedmiot</th>
            <th data-i18n="attendance">Obecność</th>
          </tr></thead>
          <tbody id="attendanceBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card admin-card">
      <h3 data-i18n="allLessons">Wszystkie lekcje</h3>
      <div class="bulk-actions">
        <label class="bulk-select-label">
          <input id="selectAllLessons" type="checkbox">
          <span data-i18n="selectAll">Zaznacz wszystkie lekcje</span>
        </label>
        <button id="deleteSelectedLessonsBtn" class="danger" disabled data-i18n="deleteSelected">
          Usuń wybrane lekcje
        </button>
      </div>
      <div id="adminLessonList"></div>
    </section>

    <section class="card admin-card">
      <h3 data-i18n="icsTitle">Import i eksport ICS</h3>
      <div class="actions">
        <button id="exportIcsBtn" data-i18n="exportIcs">Eksportuj ICS</button>
        <input id="icsFile" type="file" accept=".ics,text/calendar">
        <button id="importIcsBtn" data-i18n="importIcs">Importuj ICS</button>
      </div>
      <p id="icsMessage" class="muted"></p>
    </section>

    <section class="card admin-card">
      <h3 data-i18n="saveRepo">Zapis do repozytorium</h3>
      <p class="muted" data-i18n="repoHint">Skopiuj JSON-y i zapisz je w repozytorium, aby zachować zmiany.</p>
      <label for="subjectsJson">data/subjects.json</label>
      <textarea id="subjectsJson" readonly></textarea>
      <button class="copyJson" data-target="subjectsJson" data-i18n="copySubjects">Kopiuj JSON przedmiotów</button>
      <label for="lessonsJson">data/lessons.json</label>
      <textarea id="lessonsJson" readonly></textarea>
      <button class="copyJson" data-target="lessonsJson" data-i18n="copyLessons">Kopiuj JSON lekcji</button>
      <label for="settingsJson">data/settings.json</label>
      <textarea id="settingsJson" readonly></textarea>
      <button class="copyJson" data-target="settingsJson" data-i18n="copySettings">Kopiuj JSON ustawień</button>
    </section>
  </main>
</div>

<dialog id="lessonDialog">
  <form id="lessonForm">
    <h2 id="lessonFormTitle"></h2>
    <input id="lessonId" type="hidden">
    <input id="lessonDate" type="hidden">

    <label data-i18n="subject" for="lessonSubject">Przedmiot</label>
    <select id="lessonSubject" required></select>

    <div class="form-grid">
      <div>
        <label data-i18n="startTime" for="lessonTime">Godzina rozpoczęcia</label>
        <input id="lessonTime" type="time" required>
      </div>
      <div>
        <label data-i18n="eventTimezone" for="eventZone">Strefa czasowa lekcji</label>
        <select id="eventZone"></select>
      </div>
    </div>

    <div id="firstLessonArea">
      <label class="check-row">
        <input id="isFirstLesson" type="checkbox">
        <span data-i18n="newGradeFirst">To pierwsza lekcja nowej klasy / rocznika</span>
      </label>
      <div id="classArea" class="hidden">
        <label data-i18n="grade" for="schoolClass">Klasa</label>
        <select id="schoolClass">
          <option value="" data-i18n="chooseGrade">Wybierz klasę</option>
          <option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option>
          <option value="5">5</option><option value="6">6</option>
          <option value="7">7</option><option value="8">8</option>
        </select>
        <label data-i18n="yearPlanCount" for="schoolYearLessonCount">Liczba lekcji w roku szkolnym</label>
        <input id="schoolYearLessonCount" type="number" min="1" value="20">
      </div>
    </div>

    <label data-i18n="attendance" for="lessonAttendance">Obecność</label>
    <select id="lessonAttendance">
      <option value="unknown" data-i18n="unknown">Nieustalona</option>
      <option value="present" data-i18n="present">Obecny / obecna</option>
      <option value="absent" data-i18n="absent">Nieobecny / nieobecna</option>
    </select>

    <label data-i18n="alarm" for="lessonAlarms">Alarm przed lekcją</label>
    <select id="lessonAlarms">
      <option value="5" selected data-i18n="alarm5">5 minut</option>
      <option value="10" data-i18n="alarm10">10 minut</option>
      <option value="15" data-i18n="alarm15">15 minut</option>
      <option value="30" data-i18n="alarm30">30 minut</option>
      <option value="60" data-i18n="alarm60">1 godzina</option>
    </select>

    <label data-i18n="note" for="lessonNote">Notatka</label>
    <textarea id="lessonNote" maxlength="1000"></textarea>

    <div class="dialog-actions">
      <button id="cancelLessonBtn" type="button" data-i18n="cancel">Anuluj</button>
      <button id="saveLessonBtn" class="primary" type="submit" data-i18n="save">Zapisz</button>
    </div>
  </form>
</dialog>

  document.documentElement.lang = lang;

  const weekdays = lang === "ja"
    ? ["月","火","水","木","金","土","日"]
    : ["Pon","Wt","Śr","Czw","Pt","Sob","Niedz"];

  const palette = ["#5147e8","#168451","#e06a24","#bd3045","#147a9e","#a13e9b"];

  let subjects = [];
  let lessons = [];
  let settings = { displayTimeZone: defaultZone };
  let mode = "month";
  let cursor = new Date();
  cursor.setHours(0,0,0,0);
  let selectedDate = new Date(cursor);

  let dragTimer = null;
  let dragGhost = null;
  let dragOverElement = null;

  let suppressClickUntil = 0;

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, c =>
      ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
  }
  function id() {
    return crypto.randomUUID?.() || `id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }
  function pad(n) { return String(n).padStart(2,"0"); }
  function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function fromKey(key) {
    const [y,m,d] = key.split("-").map(Number);
    return new Date(y,m-1,d);
  }
  function startWeek(d) {
    const x = new Date(d);
    x.setDate(x.getDate()-((x.getDay()+6)%7));
    x.setHours(0,0,0,0);
    return x;
  }
  function zone() { return settings.displayTimeZone || defaultZone; }
  function parts(date, tz) {
    return Object.fromEntries(new Intl.DateTimeFormat("en-CA", {
      timeZone:tz, year:"numeric",month:"2-digit",day:"2-digit",
      hour:"2-digit",minute:"2-digit",hourCycle:"h23"
    }).formatToParts(date).map(p => [p.type,p.value]));
  }
  function zonedIso(dateText,timeText,tz) {
    const [y,m,d] = dateText.split("-").map(Number);
    const [h,min] = timeText.split(":").map(Number);
    const wanted = Date.UTC(y,m-1,d,h,min);
    let guess = wanted;
    for (let i=0;i<4;i++) {
      const p = parts(new Date(guess),tz);
      guess += wanted - Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute);
    }
    return new Date(guess).toISOString();
  }
  function fmtDate(iso,tz=zone()) {
    return new Intl.DateTimeFormat(lang==="ja"?"ja-JP":"pl-PL", {
      timeZone:tz, dateStyle:"medium", timeStyle:"short"
    }).format(new Date(iso));
  }
  function fmtTime(iso,tz=zone()) {
    return new Intl.DateTimeFormat(lang==="ja"?"ja-JP":"pl-PL", {
      timeZone:tz,hour:"2-digit",minute:"2-digit"
    }).format(new Date(iso));
  }
  function subjectById(subjectId) { return subjects.find(s => s.id===subjectId); }
  function subjectLabel(s) {
    if (!s) return T.noSubject;
    return s.grade ? `${s.name} (${s.grade}${T.classLabel})` : s.name;
  }
  function subjectLessons(subjectId) {
    return lessons.filter(l=>l.subjectId===subjectId).sort((a,b)=>new Date(a.start)-new Date(b.start));
  }
  function lessonNum(l) { return subjectLessons(l.subjectId).findIndex(x=>x.id===l.id)+1; }
  function lessonTitle(l) {
    const s=subjectById(l.subjectId);
    return `${s?.name || T.noSubject} ${lessonNum(l)}${s?.grade ? ` (${s.grade}${T.classLabel})` : ""}`;
  }
  function attendanceText(status) {
    return status==="present" ? T.present : status==="absent" ? T.absent : T.unknown;
  }
  function lessonsOn(date) {
    const key=dateKey(date);
    return lessons.filter(l=>{
      const p=parts(new Date(l.start),zone());
      return `${p.year}-${p.month}-${p.day}`===key;
    }).sort((a,b)=>new Date(a.start)-new Date(b.start));
  }

  function renderLessonCard(l) {
    const s=subjectById(l.subjectId);
    return `<article class="lesson-card" style="--lesson-color:${esc(s?.color||"#5147e8")}">
      <button type="button" class="lesson-main" data-edit-lesson="${esc(l.id)}">
        <span class="lesson-line"><span>${esc(fmtTime(l.start))}</span><span>${esc(lessonTitle(l))}</span></span>
        <span class="muted">45 ${T.minutes}</span>
      </button>
      <select class="attendance" data-attendance="${esc(l.id)}" aria-label="${esc(T.attendance)}">
        <option value="unknown" ${!l.attendance||l.attendance==="unknown"?"selected":""}>${T.unknown}</option>
        <option value="present" ${l.attendance==="present"?"selected":""}>${T.presentOption}</option>
        <option value="absent" ${l.attendance==="absent"?"selected":""}>${T.absentOption}</option>
      </select>
    </article>`;
  }

  function bindEvents(root) {
    root.querySelectorAll("[data-edit-lesson]").forEach(b =>
      b.addEventListener("click",()=>openLesson(b.dataset.editLesson)));
    root.querySelectorAll("[data-attendance]").forEach(sel =>
      sel.addEventListener("change",()=>{
        const l=lessons.find(x=>x.id===sel.dataset.attendance);
        if(l){ l.attendance=sel.value; renderAll(); }
      }));
  }

  function renderMonth() {
    const first=new Date(cursor.getFullYear(),cursor.getMonth(),1);
    const begin=startWeek(first);
    $("periodLabel").textContent=new Intl.DateTimeFormat(lang==="ja"?"ja-JP":"pl-PL",{
      month:"long",year:"numeric"
    }).format(cursor);

    let html=`<div class="weekdays">${weekdays.map(d=>`<div class="weekday">${d}</div>`).join("")}</div><div class="month-grid">`;
    for(let i=0;i<42;i++){
      const d=new Date(begin); d.setDate(begin.getDate()+i);
      const key=dateKey(d), events=lessonsOn(d);
      const cls=["month-day",d.getMonth()!==cursor.getMonth()?"outside":"",
        key===dateKey(selectedDate)?"selected":"",
        key===dateKey(new Date())?"today":""].filter(Boolean).join(" ");
      const eventHtml=events.slice(0,3).map(l=>{
        const s=subjectById(l.subjectId);
        return `<button type="button" class="month-event" data-edit-lesson="${esc(l.id)}"
          style="--event-color:${esc(s?.color||"#5147e8")}">${esc(lessonTitle(l))}</button>`;
      }).join("");
      html+=`<div class="${cls}" data-drop-date="${key}">
        <div class="day-head">
          <button class="day-num" data-select-date="${key}">${d.getDate()}</button>
          <button class="add-day" data-add-date="${key}" aria-label="+">+</button>
        </div><div class="month-events">${eventHtml}</div>
      </div>`;
    }
    $("monthView").innerHTML=html+"</div>";
    $("monthView").querySelectorAll("[data-select-date]").forEach(b=>b.addEventListener("click",()=>{
      selectedDate=fromKey(b.dataset.selectDate); cursor=new Date(selectedDate); renderCalendar();
    }));
    $("monthView").querySelectorAll("[data-add-date]").forEach(b=>b.addEventListener("click",()=>{
      selectedDate=fromKey(b.dataset.addDate); openLesson(null,selectedDate);
    }));
    bindEvents($("monthView"));

    $("selectedDateTitle").textContent=new Intl.DateTimeFormat(lang==="ja"?"ja-JP":"pl-PL",{
      timeZone:zone(),weekday:"long",year:"numeric",month:"long",day:"numeric"
    }).format(selectedDate);
    const dayLessons=lessonsOn(selectedDate);
    $("selectedDateCount").textContent=dayLessons.length ? `${dayLessons.length} ${T.lessons}` : "";
    $("selectedDayLessons").innerHTML=dayLessons.length
      ? dayLessons.map(renderLessonCard).join("")
      : `<div class="empty">${T.noLessons} ${T.addHint}</div>`;
    bindEvents($("selectedDayLessons"));
  }

  function renderWeek() {
    const start=startWeek(cursor);
    const dates=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d;});
    const end=dates[6];
    const locale=lang==="ja"?"ja-JP":"pl-PL";
    $("periodLabel").textContent=`${start.toLocaleDateString(locale,{month:"short",day:"numeric"})} – ${end.toLocaleDateString(locale,{year:"numeric",month:"short",day:"numeric"})}`;

    let heads='<div class="week-head"></div>';
    dates.forEach((d,i)=>heads+=`<div class="week-head">${weekdays[i]}<br>${d.getMonth()+1}/${d.getDate()}</div>`);
    let axis='<div class="time-axis">';
    for(let h=0;h<24;h++) axis+=`<span class="hour-label" style="top:${h*56}px">${pad(h)}:00</span>`;
    axis+='</div>';

    let cols="";
    dates.forEach(d=>{
      let ev="";
      lessonsOn(d).forEach(l=>{
        const p=parts(new Date(l.start),zone()), mins=+p.hour*60 + +p.minute;
        const s=subjectById(l.subjectId);
        ev+=`<button class="week-event" data-edit-lesson="${esc(l.id)}"
          style="top:${mins/60*56}px;--event-color:${esc(s?.color||"#5147e8")}">
          <strong>${esc(fmtTime(l.start))} ${esc(lessonTitle(l))}</strong><span>45 ${T.minutes}</span>
        </button>`;
      });
      cols+=`<div class="week-column" data-drop-date="${dateKey(d)}">${ev}</div>`;
    });

    const agenda=dates.map(d=>{
      const items=lessonsOn(d);
      const title=new Intl.DateTimeFormat(locale,{timeZone:zone(),weekday:"long",month:"long",day:"numeric"}).format(d);
      return `<section class="day-card" data-drop-date="${dateKey(d)}">
        <div class="day-card-head"><b>${esc(title)}</b>
          <button data-add-date="${dateKey(d)}">+</button></div>
        ${items.length?items.map(renderLessonCard).join(""):`<div class="muted">${T.noLessons}</div>`}
      </section>`;
    }).join("");

    $("weekView").innerHTML=`<div class="week-scroll"><div class="week-grid">${heads}${axis}${cols}</div></div>
      <div class="section-heading"><h2>${T.allLessons}</h2></div><div class="week-days">${agenda}</div>`;
    $("weekView").querySelectorAll("[data-add-date]").forEach(b=>b.addEventListener("click",()=>openLesson(null,fromKey(b.dataset.addDate))));
    bindEvents($("weekView"));
  }

  function renderCalendar() {
    $("monthView").classList.toggle("hidden",mode!=="month");
    $("monthAgenda").classList.toggle("hidden",mode!=="month");
    $("weekView").classList.toggle("hidden",mode!=="week");
    $("monthBtn").classList.toggle("active",mode==="month");
    $("weekBtn").classList.toggle("active",mode==="week");
    mode==="month"?renderMonth():renderWeek();
  }

    $("subjectsJson").value=JSON.stringify(subjects,null,2);

    $("settingsJson").value=JSON.stringify(settings,null,2);

  function renderAdmin() {
    const chosen=$("lessonSubject").value;
    $("lessonSubject").innerHTML=subjects.map(s=>`<option value="${esc(s.id)}">${esc(subjectLabel(s))}</option>`).join("");
    if(subjects.some(s=>s.id===chosen)) $("lessonSubject").value=chosen;

    const oldFilter=$("attendanceFilter").value||"all";
    $("attendanceFilter").innerHTML=`<option value="all">${T.allSubjects}</option>`+
      subjects.map(s=>`<option value="${esc(s.id)}">${esc(subjectLabel(s))}</option>`).join("");
    $("attendanceFilter").value=oldFilter;

    const present=lessons.filter(l=>l.attendance==="present").length;
    const absent=lessons.filter(l=>l.attendance==="absent").length;
    const unknown=lessons.length-present-absent;
    const decided=present+absent;

    $("overallStats").innerHTML=`
      <div class="stat"><b>${T.allLessons}</b><br>${lessons.length}</div>
      <div class="stat"><b>${T.attendanceCount}</b><br>${present}</div>
      <div class="stat"><b>${T.absenceCount}</b><br>${absent}</div>
      <div class="stat"><b>${T.unknownCount}</b><br>${unknown}</div>
      <div class="stat"><b>${T.attendanceRate}</b><br>${decided?Math.round(present/decided*100)+"%":"—"}</div>`;

    $("subjectList").innerHTML=subjects.map(s=>{
      const count=lessons.filter(l=>l.subjectId===s.id).length;
      const planned=Number(s.plannedCount)||0;
      return `<div class="subject-row">
        <div class="row-info"><b style="color:${esc(s.color)}">${esc(subjectLabel(s))}</b><br>
        <span class="muted">${T.planned}: ${planned} · ${T.entered}: ${count} · ${T.remaining}: ${Math.max(0,planned-count)}</span></div>
        <button data-edit-subject="${esc(s.id)}">${T.edit}</button>
      </div>`;
    }).join("") || `<div class="empty">${T.noSubject}</div>`;

    $("subjectList").querySelectorAll("[data-edit-subject]").forEach(b=>b.addEventListener("click",()=>editSubject(b.dataset.editSubject)));

    const filtered=lessons.filter(l=>oldFilter==="all"||l.subjectId===oldFilter);
    $("attendanceBody").innerHTML=filtered.length?filtered.map(l=>`
      <tr><td>${lessonNum(l)}</td><td>${esc(subjectLabel(subjectById(l.subjectId)))}</td>
      <td><select data-attendance="${esc(l.id)}">
        <option value="unknown" ${!l.attendance||l.attendance==="unknown"?"selected":""}>${T.unknown}</option>
        <option value="present" ${l.attendance==="present"?"selected":""}>${T.presentOption}</option>
        <option value="absent" ${l.attendance==="absent"?"selected":""}>${T.absentOption}</option>
      </select></td></tr>`).join(""):`<tr><td colspan="3">${T.noLessons}</td></tr>`;
    bindEvents($("attendanceBody"));

    const sorted=[...lessons].sort((a,b)=>new Date(a.start)-new Date(b.start));
    selectedLessonIds=new Set([...selectedLessonIds].filter(x=>lessons.some(l=>l.id===x)));
    $("adminLessonList").innerHTML=sorted.map(l=>`
      <div class="lesson-admin-row">
        <div class="lesson-row-main">
          <input type="checkbox" data-select-lesson="${esc(l.id)}" ${selectedLessonIds.has(l.id)?"checked":""}>
          <div class="row-info"><b>${esc(lessonTitle(l))}</b><br><span class="muted">${esc(fmtDate(l.start))}</span></div>
        </div>
        <div class="row-actions">
          <button data-edit-lesson="${esc(l.id)}">${T.edit}</button>
          <button class="danger" data-delete-lesson="${esc(l.id)}">${T.delete}</button>
        </div>
      </div>`).join("")||`<div class="empty">${T.noLessons}</div>`;

    $("adminLessonList").querySelectorAll("[data-select-lesson]").forEach(box=>box.addEventListener("change",()=>{
      box.checked?selectedLessonIds.add(box.dataset.selectLesson):selectedLessonIds.delete(box.dataset.selectLesson);
      renderAdmin();
    }));
    $("adminLessonList").querySelectorAll("[data-edit-lesson]").forEach(b=>b.addEventListener("click",()=>openLesson(b.dataset.editLesson)));
    $("adminLessonList").querySelectorAll("[data-delete-lesson]").forEach(b=>b.addEventListener("click",()=>{
      if(confirm(T.confirmDelete)){ lessons=lessons.filter(l=>l.id!==b.dataset.deleteLesson); renderAll(); }
    }));

    $("selectAllLessons").checked=sorted.length>0&&sorted.every(l=>selectedLessonIds.has(l.id));
    $("deleteSelectedLessonsBtn").disabled=!selectedLessonIds.size;
    $("deleteSelectedLessonsBtn").textContent=selectedLessonIds.size
      ? `${T.deleteSelected} (${selectedLessonIds.size})` : T.deleteSelected;

    refreshJson();
  }

  function renderAll(){ renderCalendar(); renderAdmin(); }

  function resetSubjectForm(){
    $("subjectId").value=""; $("subjectName").value="";
    $("subjectColor").value="#5147e8"; $("subjectPlanned").value="0";
    $("subjectGrade").value="";
    $("subjectFormTitle").textContent=T.addSubject;
    $("saveSubjectBtn").textContent=T.addSubject;
    $("cancelSubjectEditBtn").classList.add("hidden");
  }

  function editSubject(subjectId){
    const s=subjectById(subjectId); if(!s)return;
    $("subjectId").value=s.id; $("subjectName").value=s.name;
    $("subjectColor").value=s.color||"#5147e8";
    $("subjectPlanned").value=Number(s.plannedCount)||0;
    $("subjectGrade").value=s.grade?String(s.grade):"";
    $("subjectFormTitle").textContent=T.edit;
    $("saveSubjectBtn").textContent=T.save;
    $("cancelSubjectEditBtn").classList.remove("hidden");
  }

  function saveSubject(){
    const name=$("subjectName").value.trim(), sid=$("subjectId").value;
    const grade=$("subjectGrade").value?Number($("subjectGrade").value):null;
    if(!name)return;
    if(subjects.some(s=>s.name.toLowerCase()===name.toLowerCase()&&Number(s.grade||0)===Number(grade||0)&&s.id!==sid)){
      alert(T.duplicateGrade); return;
    }
    const data={name,color:$("subjectColor").value,plannedCount:+$("subjectPlanned").value||0,grade};
    if(sid) Object.assign(subjectById(sid),data);
    else subjects.push({id:id(),...data});
    resetSubjectForm(); renderAll();
  }

  function updateFirstLesson(){
    const s=subjectById($("lessonSubject").value);
    $("classArea").classList.toggle("hidden",!$("isFirstLesson").checked);
    if(s){
      $("schoolClass").value=s.grade?String(s.grade):"";
      $("schoolYearLessonCount").value=String(Number(s.plannedCount)||20);
    }
  }

  function openLesson(lessonId=null,date=selectedDate){
    if(!subjects.length){alert(T.chooseSubject);return;}
    editingId=lessonId;
    $("lessonForm").reset();
    $("lessonId").value=lessonId||"";
    $("lessonDate").value=dateKey(date);
    $("lessonFormTitle").textContent=lessonId?T.editLesson:T.addLesson;
    $("lessonAttendance").value="unknown";
    $("lessonAlarms").value="5";
    $("schoolClass").value="";
    $("schoolYearLessonCount").value="20";
    $("eventZone").value=zone();
    $("firstLessonArea").classList.remove("hidden");
    $("classArea").classList.add("hidden");

    const l=lessons.find(x=>x.id===lessonId);
    if(l){
      const z=l.timeZone||zone(), p=parts(new Date(l.start),z);
      $("lessonSubject").value=l.subjectId;
      $("lessonDate").value=`${p.year}-${p.month}-${p.day}`;
      $("lessonTime").value=`${p.hour}:${p.minute}`;
      $("eventZone").value=z;
      $("lessonAttendance").value=l.attendance||"unknown";
      $("lessonNote").value=l.note||"";
      const alarm=String(l.alarms?.[0]??5);
      $("lessonAlarms").value=["5","10","15","30","60"].includes(alarm)?alarm:"5";
      $("firstLessonArea").classList.add("hidden");
    } else {
      $("lessonSubject").value=subjects[0].id;
      updateFirstLesson();
    }
    $("lessonDialog").showModal();
  }

  function saveLesson(e){
    e.preventDefault();
    const lessonId=$("lessonId").value;
    let subject=subjectById($("lessonSubject").value);
    let subjectId=subject?.id;
    const date=$("lessonDate").value,time=$("lessonTime").value;
    if(!date||!time){alert(T.chooseDateTime);return;}
    if(!subject){alert(T.chooseSubject);return;}

    if(!lessonId&&$("isFirstLesson").checked){
      const grade=Number($("schoolClass").value);
      const planned=Number($("schoolYearLessonCount").value);
      if(!grade||grade>8){alert(T.chooseGradeError);return;}
      if(!Number.isInteger(planned)||planned<1){alert(T.countError);return;}

      let variant=subjects.find(s=>s.name.toLowerCase()===subject.name.toLowerCase()&&Number(s.grade||0)===grade);
      if(variant&&variant.id!==subject.id){alert(T.duplicateGrade);return;}

      if(!variant&&subject.grade&&subject.grade!==grade){
        variant={id:id(),name:subject.name,color:subject.color,grade,plannedCount:planned};
        subjects.push(variant);
        subject=variant; subjectId=variant.id;
      } else {
        subject.grade=grade;
        subject.plannedCount=planned;
      }
    } else if(!lessonId&&!subject.grade&&!lessons.some(l=>l.subjectId===subject.id)){
      alert(T.chooseFirst);return;
    }

    const tz=$("eventZone").value||defaultZone;
    const start=zonedIso(date,time,tz);
    const later=lessons.some(l=>l.subjectId===subjectId&&l.id!==lessonId&&new Date(l.start)>new Date(start));
    if(later&&!confirm(T.earlierWarning))return;

    const old=lessons.find(l=>l.id===lessonId);
    const updated={
      id:lessonId||id(),subjectId,start,timeZone:tz,
      attendance:$("lessonAttendance").value,
      alarms:[Number($("lessonAlarms").value)||5],
      note:$("lessonNote").value.trim(),uid:old?.uid||""
    };
    if(lessonId) lessons=lessons.map(l=>l.id===lessonId?updated:l);
    else lessons.push(updated);
    selectedDate=new Date(start); cursor=new Date(selectedDate);
    $("lessonDialog").close(); renderAll();
  }

  function findDrop(x,y){return document.elementFromPoint(x,y)?.closest("[data-drop-date]")||null;}
  function clearDrag(){
    dragOverElement?.classList.remove("drag-over"); dragOverElement=null;
    dragPreview?.remove(); dragPreview=null;
  }
  function previewDrag(x,y){
    clearDrag();
    const target=findDrop(x,y); if(!target)return;
    dragOverElement=target; target.classList.add("drag-over");
    const col=target.closest(".week-column");
    if(!col)return;
    const r=col.getBoundingClientRect();
    let mins=Math.round((Math.max(0,y-r.top)/56*60)/15)*15;
    mins=Math.max(0,Math.min(1395,mins));
    dragPreview=document.createElement("div");
    dragPreview.className="week-drop-preview";
    dragPreview.style.top=`${mins/60*56}px`;
    dragPreview.textContent=`${pad(Math.floor(mins/60))}:${pad(mins%60)} · 45 ${T.minutes}`;
    col.appendChild(dragPreview);
  }
  function moveLesson(lessonId,target,y){
    const l=lessons.find(x=>x.id===lessonId); if(!l)return;
    const tz=zone(), col=target.closest(".week-column");
    const p=parts(new Date(l.start),tz);
    let mins=+p.hour*60 + +p.minute;
    if(col){
      const r=col.getBoundingClientRect();
      mins=Math.round((Math.max(0,y-r.top)/56*60)/15)*15;
      mins=Math.max(0,Math.min(1395,mins));
    }
    l.start=zonedIso(target.dataset.dropDate,`${pad(Math.floor(mins/60))}:${pad(mins%60)}`,tz);
    l.timeZone=tz;
    selectedDate=fromKey(target.dataset.dropDate); cursor=new Date(selectedDate);
    renderAll();
    requestAnimationFrame(()=>{
      [...document.querySelectorAll("[data-edit-lesson]")].find(el=>
        el.dataset.editLesson===lessonId&&el.getClientRects().length
      )?.scrollIntoView({behavior:"smooth",block:"center",inline:"center"});
    });
  }
  function beginDrag(){
    if(!dragState||dragState.started)return;
    const l=lessons.find(x=>x.id===dragState.id); if(!l)return;
    dragState.started=true;
    dragGhost=document.createElement("div"); dragGhost.className="drag-ghost";
    dragGhost.textContent=lessonTitle(l);
    dragGhost.style.setProperty("--drag-color",subjectById(l.subjectId)?.color||"#5147e8");
    document.body.appendChild(dragGhost);
    document.body.style.userSelect="none";
  }
  function stopDrag(){
    clearTimeout(dragTimer); dragTimer=null; clearDrag();
    dragGhost?.remove(); dragGhost=null;
    document.body.style.userSelect=""; dragState=null;
  }
  function installDragging(){
    document.addEventListener("pointerdown",e=>{
      const button=e.target.closest("[data-edit-lesson]");
      if(!button||!e.isPrimary||(e.pointerType==="mouse"&&e.button!==0))return;
      if(!lessons.some(l=>l.id===button.dataset.editLesson))return;
      dragState={id:button.dataset.editLesson,pointer:e.pointerId,type:e.pointerType,
        x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,started:false};
      if(e.pointerType==="touch")dragTimer=setTimeout(beginDrag,350);
    });
    document.addEventListener("pointermove",e=>{
      if(!dragState||e.pointerId!==dragState.pointer)return;
      dragState.x=e.clientX; dragState.y=e.clientY;
      if(dragState.type==="mouse"&&!dragState.started&&Math.hypot(e.clientX-dragState.sx,e.clientY-dragState.sy)>6)beginDrag();
      if(!dragState.started)return;
      e.preventDefault();
      if(dragGhost){dragGhost.style.left=`${e.clientX}px`;dragGhost.style.top=`${e.clientY}px`;}
      previewDrag(e.clientX,e.clientY);
    },{passive:false});
    document.addEventListener("pointerup",e=>{
      if(!dragState||e.pointerId!==dragState.pointer)return;
      clearTimeout(dragTimer);
      if(dragState.started){
        const target=findDrop(e.clientX,e.clientY);
        if(target)moveLesson(dragState.id,target,e.clientY);
        suppressClickUntil=Date.now()+500;
      }
      stopDrag();
    });
    document.addEventListener("pointercancel",stopDrag);
    document.addEventListener("click",e=>{
      if(Date.now()<suppressClickUntil&&e.target.closest("[data-edit-lesson]")){
        e.preventDefault();e.stopImmediatePropagation();
      }
    },true);
  }

  function colorUsed(color){return subjects.some(s=>(s.color||"").toLowerCase()===color.toLowerCase());}
  function unusedColor(){
    const free=palette.find(c=>!colorUsed(c)); if(free)return free;
    for(let h=0;h<360;h+=17){
      const c=`hsl(${h} 68% 45%)`;
      if(!colorUsed(c))return c;
    }
    let c;
    do{c="#"+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,"0");}while(colorUsed(c));
    return c;
  }
  function unfoldIcs(s){return s.replace(/\r?\n[ \t]/g,"");}
  function unescapeIcs(s){return String(s||"").replace(/\\n/gi,"\n").replace(/\\,/g,",").replace(/\\;/g,";").replace(/\\\\/g,"\\");}
  function parseProps(block){
    const out={};
    block.split(/\r?\n/).forEach(line=>{
      const i=line.indexOf(":"); if(i<0)return;
      const left=line.slice(0,i).split(";"),params={};
      left.slice(1).forEach(x=>{const n=x.indexOf("=");if(n>0)params[x.slice(0,n).toUpperCase()]=x.slice(n+1).replace(/^"|"$/g,"");});
      out[left[0].toUpperCase()]={value:line.slice(i+1),params};
    });
    return out;
  }
  function parseIcsDate(prop){
    if(!prop?.value)return null;
    const v=prop.value,tz=prop.params?.TZID||zone();
    if(/^\d{8}T\d{6}Z$/.test(v)){
      return new Date(Date.UTC(+v.slice(0,4),+v.slice(4,6)-1,+v.slice(6,8),+v.slice(9,11),+v.slice(11,13),+v.slice(13,15))).toISOString();
    }
    if(/^\d{8}T\d{6}$/.test(v)){
      return zonedIso(`${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`,`${v.slice(9,11)}:${v.slice(11,13)}`,tz);
    }
    if(/^\d{8}$/.test(v))return zonedIso(`${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`,"09:00",tz);
    return null;
  }
  function findOrCreateSubject(title){
    const match=[...subjects].sort((a,b)=>b.name.length-a.name.length)
      .find(s=>title.toLowerCase().startsWith((s.name+" ").toLowerCase()));
    if(match)return match;
    const base=(title.match(/^(.*?)[\s_-]+\d+$/)?.[1]||title).trim()||T.noSubject;
    let s=subjects.find(x=>x.name.toLowerCase()===base.toLowerCase());
    if(!s){s={id:id(),name:base,color:unusedColor(),plannedCount:0,grade:null};subjects.push(s);}
    return s;
  }
  async function importIcs(){
    const file=$("icsFile").files[0];
    if(!file){$("icsMessage").textContent=T.chooseFile;return;}
    try{
      const blocks=unfoldIcs(await file.text()).match(/BEGIN:VEVENT[\s\S]*?END:VEVENT/gi)||[];
      const known=new Set(lessons.map(l=>l.uid).filter(Boolean)), added=[];
      for(const block of blocks){
        const p=parseProps(block), start=parseIcsDate(p.DTSTART); if(!start)continue;
        const uid=p.UID?.value||""; if(uid&&known.has(uid))continue;
        const title=unescapeIcs(p.SUMMARY?.value||T.noSubject), s=findOrCreateSubject(title);
        const alarms=[...block.matchAll(/TRIGGER\s*[:=]\s*-?PT(\d+)M/gi)].map(m=>+m[1]).filter(Number.isFinite);
        added.push({id:id(),uid,subjectId:s.id,start,timeZone:p.DTSTART?.params?.TZID||zone(),attendance:"unknown",alarms,note:unescapeIcs(p.DESCRIPTION?.value||"")});
        if(uid)known.add(uid);
      }
      if(!added.length){$("icsMessage").textContent=T.noImported;return;}
      lessons.push(...added);renderAll();$("icsFile").value="";
      $("icsMessage").textContent=`${added.length} ${T.imported}`;
    }catch(err){console.error(err);$("icsMessage").textContent=T.importError;}
  }
  function icsEscape(s){return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");}
  function icsTime(iso){return new Date(iso).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");}
  function exportIcs(){
    const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Lesson Calendar//","CALSCALE:GREGORIAN"];
    lessons.forEach(l=>{
      lines.push("BEGIN:VEVENT",`UID:${icsEscape(l.uid||l.id)}@calendar`,`DTSTAMP:${icsTime(new Date().toISOString())}`,
        `DTSTART:${icsTime(l.start)}`,`DTEND:${icsTime(new Date(new Date(l.start).getTime()+45*60000).toISOString())}`,
        `SUMMARY:${icsEscape(lessonTitle(l))}`);
      (l.alarms||[]).forEach(a=>lines.push("BEGIN:VALARM",`TRIGGER:-PT${+a||5}M`,"ACTION:DISPLAY",
        `DESCRIPTION:${icsEscape(lessonTitle(l))}`,"END:VALARM"));
      lines.push("END:VEVENT");
    });
    lines.push("END:VCALENDAR");
    const link=document.createElement("a");
    link.href=URL.createObjectURL(new Blob([lines.join("\r\n")],{type:"text/calendar"}));
    link.download="lessons.ics";link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);
  }
  async function loadJson(path,fallback){
    try{const r=await fetch(path);if(!r.ok)throw 0;return await r.json();}catch{return fallback;}
  }
  async function copyJson(idValue){
    try{await navigator.clipboard.writeText($(idValue).value);alert(T.copied);}
    catch{$(idValue).select();document.execCommand("copy");alert(T.copied);}
  }

  $("prevBtn").onclick=()=>{if(mode==="month")cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);else cursor.setDate(cursor.getDate()-7);selectedDate=new Date(cursor);renderAll();};
  $("nextBtn").onclick=()=>{if(mode==="month")cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);else cursor.setDate(cursor.getDate()+7);selectedDate=new Date(cursor);renderAll();};
  $("todayBtn").onclick=()=>{cursor=new Date();cursor.setHours(0,0,0,0);selectedDate=new Date(cursor);renderAll();};
  $("monthBtn").onclick=()=>{mode="month";renderCalendar();};
  $("weekBtn").onclick=()=>{mode="week";renderCalendar();};
  $("adminToggle").onclick=()=>{$("calendarView").classList.add("hidden");$("adminView").classList.remove("hidden");renderAdmin();};
  $("backCalendarBtn").onclick=()=>{$("adminView").classList.add("hidden");$("calendarView").classList.remove("hidden");renderAll();};
  $("saveSubjectBtn").onclick=saveSubject;
  $("cancelSubjectEditBtn").onclick=resetSubjectForm;
  $("attendanceFilter").onchange=renderAdmin;
  $("saveDisplayZoneBtn").onclick=()=>{settings.displayTimeZone=$("displayZone").value||defaultZone;renderAll();};
  $("lessonSubject").onchange=updateFirstLesson;
  $("isFirstLesson").onchange=updateFirstLesson;
  $("lessonForm").onsubmit=saveLesson;
  $("cancelLessonBtn").onclick=()=>$("lessonDialog").close();
  $("importIcsBtn").onclick=importIcs;
  $("exportIcsBtn").onclick=exportIcs;

  $("selectAllLessons").onchange=()=>{
    if($("selectAllLessons").checked)lessons.forEach(l=>selectedLessonIds.add(l.id));
    else selectedLessonIds.clear();
    renderAdmin();
  };
  $("deleteSelectedLessonsBtn").onclick=()=>{
    if(!selectedLessonIds.size){alert(T.noneSelected);return;}
    if(!confirm(T.confirmMany))return;
    lessons=lessons.filter(l=>!selectedLessonIds.has(l.id));
    selectedLessonIds.clear();renderAll();
  };
  document.querySelectorAll(".copyJson").forEach(b=>b.onclick=()=>copyJson(b.dataset.target));

  async function start(){
    const [s,l,c]=await Promise.all([
      loadJson("./data/subjects.json",[]),
      loadJson("./data/lessons.json",[]),
      loadJson("./data/settings.json",{displayTimeZone:defaultZone})
    ]);
    subjects=Array.isArray(s)?s:[];
    lessons=Array.isArray(l)?l:[];
    settings=c&&typeof c==="object"?c:{displayTimeZone:defaultZone};
    if(!settings.displayTimeZone)settings.displayTimeZone=defaultZone;
    renderZones();
    renderAll();
    $("loadMessage").textContent=T.dragHint;
  }

  installDragging();
  start();
})();
</script>
