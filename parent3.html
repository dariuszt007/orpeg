<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<title>Polska Szkoła</title>
        <meta name="apple-mobile-web-app-title" content="Polska Szkoła">
        <!-- Link do ładnej ikonki na iPhone'a -->
    <link rel="apple-touch-icon" href="apple-touch-icon1.png">
<style>
:root{
  --bg:#f5f6fa;
  --card:#fff;
  --text:#202437;
  --muted:#687087;
  --line:#e2e5ed;
  --primary:#5147e8;
  --soft:#eeedff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}
button,select{font:inherit;touch-action:manipulation}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid #aaa3ff;outline-offset:2px}
.hidden{display:none!important}
.app{max-width:1000px;margin:auto;padding:14px}
.topbar,.toolbar,.views,.main-tabs{display:flex;align-items:center;gap:8px}
.topbar{justify-content:space-between;margin-bottom:14px}
h1{margin:0;font-size:clamp(21px,5vw,28px)}
h2{margin:0;font-size:20px}
button{
  min-height:42px;padding:8px 12px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--text)
}
button.active{background:var(--soft);color:var(--primary);border-color:#d7d3ff}
.main-tabs{margin-bottom:12px}
.main-tabs button{flex:1}
.toolbar{flex-wrap:wrap;margin-bottom:12px}
.period{flex:1;text-align:center;font-weight:700}
.views{gap:5px}
.calendar{overflow:hidden;border:1px solid var(--line);border-radius:15px;background:var(--card)}
.weekdays,.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.weekday{
  padding:8px 2px;text-align:center;color:var(--muted);
  background:#fafaff;border-bottom:1px solid var(--line);font-size:12px
}
.month-day{
  min-width:0;min-height:82px;padding:4px 3px;display:flex;flex-direction:column;gap:3px;
  border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  border-radius:0;background:#fff
}
.month-day:nth-child(7n){border-right:0}
.month-day.outside{background:#fafbfe;color:#a3a8b5}
.month-day.selected{background:var(--soft)}
.month-day.today .day-num{background:var(--primary);color:#fff}
.day-head{display:flex;align-items:center}
.day-num{min-height:27px;width:29px;padding:0;border:0;border-radius:50%;background:transparent;font-weight:700}
.month-events{display:grid;gap:3px}
.month-event{
  width:100%;min-height:22px;overflow:hidden;padding:3px;
  border:0;border-left:3px solid var(--event-color,var(--primary));border-radius:4px;
  background:var(--event-bg,#eeedff);
  text-align:left;font-size:10px;font-weight:700;white-space:nowrap;text-overflow:ellipsis
}

.more-events {
  min-height: 28px;
  padding: 2px 3px;
  border: 0;
  background: transparent;
  color: var(--muted);
  text-align: left;
  font-size: 10px;
}
.section-heading{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 9px}
.section-heading h2{margin:0}
.muted{color:var(--muted);font-size:13px}
.week-days{display:grid;gap:8px;margin-top:12px}
.day-card{padding:11px;border:1px solid var(--line);border-radius:13px;background:#fff}
.day-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.lesson-card{
  margin:6px 0;padding:9px;border-left:6px solid var(--lesson-color,var(--primary));
  border-radius:9px;background:var(--lesson-bg,#f0efff)
}
.lesson-button{
  display:block;width:100%;padding:0;border:0;background:transparent;text-align:left;color:var(--text)
}
.lesson-line{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.lesson-meta{margin-top:4px;color:var(--muted);font-size:13px}
.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
.week-scroll{overflow:auto;border-radius:12px;background:#fff}
.week-grid{display:grid;grid-template-columns:48px repeat(7,minmax(90px,1fr));min-width:760px}
.week-head{
  height:48px;min-height:48px;padding:6px;border:1px solid var(--line);
  background:#fafaff;text-align:center;font-size:12px
}
.time-axis,.week-column{
  position:relative;height:1152px;
  background-image:repeating-linear-gradient(
    to bottom,transparent 0,transparent 47px,var(--line) 47px,var(--line) 48px
  )
}
.time-axis{position:sticky;left:0;z-index:1;background-color:#fafaff}
.hour-label{position:absolute;right:3px;transform:translateY(-50%);color:var(--muted);font-size:10px}
.week-column{border-right:1px solid var(--line);background-color:#fff}
.week-event{
  position:absolute;left:2px;right:2px;min-height:36px;overflow:hidden;
  padding:2px 3px;border:0;border-left:3px solid var(--event-color,var(--primary));
  border-radius:5px;background:var(--event-bg,#eeedff);
  text-align:left;font-size:10px;line-height:1.2;color:var(--text)
}
.week-event strong{display:block;overflow:hidden}
.attendance-card{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.form-grid label{display:block;margin-bottom:5px;color:var(--muted);font-size:12px}
.form-grid select{
  width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line);
  border-radius:9px;background:#fff;color:var(--text)
}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.stat{
  min-height:54px;padding:9px;border-radius:9px;background:#f5f6fa;
  font-size:12px;font-weight:700
}
.stat-value{display:block;margin-top:3px;font-size:14px;font-weight:400}
.table-wrap{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
th,td{padding:9px 8px;border:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f5f6fa;font-weight:700}
.attendance-present{color:#176b36;font-weight:700}
.attendance-absent{color:#a42132;font-weight:700}
.attendance-unknown{color:var(--muted)}
#loadMessage{margin-top:12px}
dialog{
  width:min(520px,calc(100% - 24px));max-height:85vh;overflow:auto;
  padding:18px;border:1px solid var(--line);border-radius:16px;color:var(--text)
}
dialog::backdrop{background:#13172788}
.dialog-close{display:flex;justify-content:flex-end;margin-top:16px}
.details-grid{display:grid;grid-template-columns:130px 1fr;gap:8px;margin-top:14px}
.details-label{color:var(--muted)}
@media(min-width:720px){.app{padding:22px}}
@media(max-width:430px){
  .app{padding:9px}
  .month-day{min-height:68px;padding:3px 2px}
  .month-event{font-size:9px}
  .period{order:4;flex-basis:100%}
  .details-grid{grid-template-columns:110px 1fr}
  .form-grid{grid-template-columns:1fr}
  th,td{padding:8px 6px;font-size:12px}
}

.topbar {
  display: none !important;
}


</style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <h1 id="appTitle"></h1>
    <span id="viewOnlyLabel" class="muted"></span>
  </header>

  <main>
    <nav class="main-tabs" aria-label="Główne zakładki">
      <button id="calendarTabBtn" type="button"></button>
      <button id="attendanceTabBtn" type="button"></button>
    </nav>

    <section id="calendarPanel">
      <div class="toolbar">
        <button id="prevBtn" type="button"></button>
        <button id="todayBtn" type="button"></button>
        <button id="nextBtn" type="button"></button>
        <div id="periodLabel" class="period"></div>
        <div class="views">
          <button id="monthBtn" type="button"></button>
          <button id="weekBtn" type="button"></button>
        </div>
      </div>

      <section id="monthView" class="calendar" aria-label="Kalendarz miesięczny"></section>
      <section id="weekView" class="hidden" aria-label="Kalendarz tygodniowy"></section>

      <section id="weekLessonsSection">
        <div class="section-heading">
          <h2 id="weekLessonsTitle"></h2>
          <span id="weekLessonsCount" class="muted"></span>
        </div>
        <div id="weekLessons" class="week-days"></div>
      </section>
    </section>

    <section id="attendancePanel" class="hidden">
      <div class="attendance-card">
        <h2 id="attendanceHeading"></h2>

        <div class="form-grid">
          <div>
            <label id="subjectFilterLabel" for="attendanceSubjectFilter"></label>
            <select id="attendanceSubjectFilter"></select>
          </div>
          <div>
            <label id="gradeFilterLabel" for="attendanceGradeFilter"></label>
            <select id="attendanceGradeFilter"></select>
          </div>
        </div>

        <p id="attendanceFilterHint" class="muted"></p>
        <div id="overallStats" class="stats"></div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th id="thLessonNumber"></th>
                <th id="thSubject"></th>
                <th id="thGrade"></th>
                <th id="thSchoolYear"></th>
                <th id="thAttendance"></th>
              </tr>
            </thead>
            <tbody id="attendanceBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <p id="loadMessage" class="muted" role="status"></p>
  </main>
</div>

<dialog id="lessonDialog" aria-labelledby="dialogTitle">
  <h2 id="dialogTitle"></h2>
  <div id="lessonDetails"></div>
  <div class="dialog-close">
    <button id="closeDialogBtn" type="button"></button>
  </div>
</dialog>

<script>
(()=>{
"use strict";

const browserLanguages=navigator.languages?.length
  ?navigator.languages
  :[navigator.language||"pl"];

const UI_LANG=browserLanguages.some(x=>/^ja\b/i.test(x))?"ja":
  browserLanguages.some(x=>/^en\b/i.test(x))?"en":"pl";

const UI_LOCALE={pl:"pl-PL",en:"en-GB",ja:"ja-JP"}[UI_LANG];

const TEXT={
  pl:{
    appTitle:"Polska Szkoła",viewOnly:"Podgląd",
    previous:"<",today:"Dziś",next:">",
    month:"Miesiąc",week:"Tydzień",calendar:"Kalendarz",attendanceTab:"Obecności",
    monthlyCalendar:"Kalendarz miesięczny",weeklyCalendar:"Kalendarz tygodniowy",
    lessonsThisWeek:"Lekcje w tym tygodniu",lessonDetails:"Szczegóły lekcji",close:"Zamknij",
    subject:"Przedmiot",lessonNumber:"Numer lekcji",dateTime:"Data i godzina",
    grade:"Klasa",schoolYear:"Rok szkolny",attendance:"Obecność",
    present:"Obecna",absent:"Nieobecna",unspecified:"Nieustalona",
    note:"Notatka",noNote:"Brak notatki",noLessons:"Brak lekcji",
    noLessonsThisWeek:"Brak lekcji w tym tygodniu.",
    lessons:"lekcji",more:"więcej",readOnly:"Widok tylko do odczytu.",
    loadError:"Nie znaleziono lekcji. Sprawdź pliki JSON w folderze data.",
    selectDay:"Wybierz dzień",subjectFilter:"Filtr przedmiotu",
    gradeFilter:"Filtr klasy",chooseSubject:"Wybierz przedmiot",
    chooseGrade:"Wybierz klasę",attendanceHint:"Wybierz przedmiot i klasę, aby wyświetlić lekcje.",
    lessonsCount:"Lekcje",presentCount:"Obecności",absentCount:"Nieobecności",
    unknownCount:"Nieustalone",frequency:"Frekwencja",
    noAttendanceRows:"Brak lekcji dla wybranego przedmiotu i klasy."
  },
  en:{
    appTitle:"Polish School",viewOnly:"View only",
    previous:"<",today:"Today",next:">",
    month:"Month",week:"Week",calendar:"Calendar",attendanceTab:"Attendance",
    monthlyCalendar:"Monthly calendar",weeklyCalendar:"Weekly calendar",
    lessonsThisWeek:"Lessons this week",lessonDetails:"Lesson details",close:"Close",
    subject:"Subject",lessonNumber:"Lesson number",dateTime:"Date and time",
    grade:"Grade",schoolYear:"School year",attendance:"Attendance",
    present:"Present",absent:"Absent",unspecified:"Unspecified",
    note:"Note",noNote:"No note",noLessons:"No lessons",
    noLessonsThisWeek:"No lessons this week.",
    lessons:"lessons",more:"more",readOnly:"View only.",
    loadError:"No lessons found. Check the JSON files in the data folder.",
    selectDay:"Select day",subjectFilter:"Subject filter",
    gradeFilter:"Grade filter",chooseSubject:"Choose subject",
    chooseGrade:"Choose grade",attendanceHint:"Choose a subject and grade to display lessons.",
    lessonsCount:"Lessons",presentCount:"Present",absentCount:"Absent",
    unknownCount:"Unspecified",frequency:"Attendance rate",
    noAttendanceRows:"No lessons for the selected subject and grade."
  },
  ja:{
    appTitle:"ポーランドの学校",viewOnly:"閲覧専用",
    previous:"前へ",today:"今日",next:"次へ",
    month:"月",week:"週",calendar:"カレンダー",attendanceTab:"出席状況",
    monthlyCalendar:"月間カレンダー",weeklyCalendar:"週間カレンダー",
    lessonsThisWeek:"今週のレッスン",lessonDetails:"レッスン詳細",close:"閉じる",
    subject:"科目",lessonNumber:"レッスン番号",dateTime:"日時",
    grade:"学年",schoolYear:"学年度",attendance:"出席状況",
    present:"出席",absent:"欠席",unspecified:"未設定",
    note:"メモ",noNote:"メモはありません",noLessons:"レッスンはありません",
    noLessonsThisWeek:"今週のレッスンはありません。",
    lessons:"件",more:"件",readOnly:"閲覧専用です。",
    loadError:"レッスンが見つかりません。dataフォルダーのJSONファイルを確認してください。",
    selectDay:"日付を選択",subjectFilter:"科目フィルター",
    gradeFilter:"学年フィルター",chooseSubject:"科目を選択",
    chooseGrade:"学年を選択",attendanceHint:"科目と学年を選択してください。",
    lessonsCount:"レッスン",presentCount:"出席",absentCount:"欠席",
    unknownCount:"未設定",frequency:"出席率",
    noAttendanceRows:"該当するレッスンはありません。"
  }
};

const t=key=>TEXT[UI_LANG][key]||key;
const $=id=>document.getElementById(id);
const DEFAULT_ZONE="Asia/Tokyo";

document.documentElement.lang=UI_LANG;
document.title = t("appTitle");
        
const appleTitle = document.querySelector(
  'meta[name="apple-mobile-web-app-title"]'
);
if (appleTitle) {
  appleTitle.content = t("appTitle");
}

let subjects=[];
let lessons=[];
let settings={displayTimeZone:DEFAULT_ZONE};
let mode="month";
let cursor=new Date();
let selectedDate=new Date();
let weekLessonsDate=new Date();
let lessonsByDate=new Map();
let lessonNumberById=new Map();

cursor.setHours(0,0,0,0);
selectedDate=new Date(cursor);
weekLessonsDate=new Date(cursor);

const pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
}[c]));

const zone=()=>settings.displayTimeZone||DEFAULT_ZONE;
const subjectById=id=>subjects.find(s=>String(s.id)===String(id));
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const fromKey=k=>{
  const [y,m,d]=k.split("-").map(Number);
  return new Date(y,m-1,d);
};

const addDays=(date,n)=>{
  const d=new Date(date);
  d.setDate(d.getDate()+n);
  return d;
};

const startOfWeek=date=>{
  const monday=new Date(date);
  monday.setHours(0,0,0,0);
  monday.setDate(monday.getDate()-((monday.getDay()+6)%7));
  return monday;
};

const todayLocal=()=>{
  const d=new Date();
  d.setHours(0,0,0,0);
  return d;
};

$("appTitle").textContent=t("appTitle");
$("viewOnlyLabel").textContent=t("viewOnly");
$("prevBtn").textContent=t("previous");
$("todayBtn").textContent=t("today");
$("nextBtn").textContent=t("next");
$("monthBtn").textContent=t("month");
$("weekBtn").textContent=t("week");
$("calendarTabBtn").textContent=t("calendar");
$("attendanceTabBtn").textContent=t("attendanceTab");
$("monthView").setAttribute("aria-label",t("monthlyCalendar"));
$("weekView").setAttribute("aria-label",t("weeklyCalendar"));
$("weekLessonsTitle").textContent=t("lessonsThisWeek");
$("attendanceHeading").textContent=t("attendanceTab");
$("subjectFilterLabel").textContent=t("subjectFilter");
$("gradeFilterLabel").textContent=t("gradeFilter");
$("attendanceFilterHint").textContent=t("attendanceHint");
$("thLessonNumber").textContent=t("lessonNumber");
$("thSubject").textContent=t("subject");
$("thGrade").textContent=t("grade");
$("thSchoolYear").textContent=t("schoolYear");
$("thAttendance").textContent=t("attendance");
$("dialogTitle").textContent=t("lessonDetails");
$("closeDialogBtn").textContent=t("close");

function parts(date,tz=zone()){
  return Object.fromEntries(new Intl.DateTimeFormat("en-CA",{
    timeZone:tz,
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit",
    hourCycle:"h23"
  }).formatToParts(date).map(x=>[x.type,x.value]));
}

function dateInZone(iso,tz=zone()){
  const p=parts(new Date(iso),tz);
  return `${p.year}-${p.month}-${p.day}`;
}

function fmtTime(iso,tz=zone()){
  return new Intl.DateTimeFormat(UI_LOCALE,{
    timeZone:tz,
    hour:"2-digit",
    minute:"2-digit"
  }).format(new Date(iso));
}

function fmtDateTime(iso,tz=zone()){
  return new Intl.DateTimeFormat(UI_LOCALE,{
    timeZone:tz,
    weekday:"long",
    year:"numeric",
    month:"long",
    day:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  }).format(new Date(iso));
}

function fmtCalendarDate(date,options){
  return new Intl.DateTimeFormat(UI_LOCALE,options).format(date);
}

function schoolYear(l){
  if(l.schoolYear)return String(l.schoolYear);
  const date=dateInZone(l.start,l.timeZone||zone());
  const [y,m]=date.split("-").map(Number);
  const start=m>=9?y:y-1;
  return `${start}-${start+1}`;
}

function currentSchoolYear(){
  const p=parts(new Date(),zone());
  const y=Number(p.year),m=Number(p.month);
  const start=m>=9?y:y-1;
  return `${start}-${start+1}`;
}

function gradeOf(l){
  if(Number(l.grade))return Number(l.grade);
  const s=subjectById(l.subjectId);
  const plan=s?.yearPlans?.find(p=>String(p.schoolYear)===schoolYear(l));
  return Number(plan?.grade)||null;
}

function lessonsOn(key){
  return lessonsByDate.get(key)||[];
}

function lessonTitle(l){
  return subjectById(l.subjectId)?.name||t("subject");
}

function rebuildIndexes(){
  lessonsByDate=new Map();
  lessonNumberById=new Map();

  const ordered=[...lessons].sort((a,b)=>new Date(a.start)-new Date(b.start));
  const counts=new Map();

  ordered.forEach(l=>{
    if(!l?.start)return;

    const year=schoolYear(l);
    const countKey=`${l.subjectId}|${year}`;
    const n=(counts.get(countKey)||0)+1;
    counts.set(countKey,n);
    lessonNumberById.set(l.id,n);

    const day=dateInZone(l.start,l.timeZone||zone());
    if(!lessonsByDate.has(day))lessonsByDate.set(day,[]);
    lessonsByDate.get(day).push(l);
  });
}

function lessonNumber(l){
  return lessonNumberById.get(l.id)||1;
}

function weekdayNames(){
  const monday=Date.UTC(2024,0,1);
  return Array.from({length:7},(_,i)=>
    new Intl.DateTimeFormat(UI_LOCALE,{
      weekday:"short",
      timeZone:"UTC"
    }).format(new Date(monday+i*86400000))
  );
}

function lessonCountText(count){
  if(UI_LANG==="ja")return `${count}${t("lessons")}`;
  if(UI_LANG==="en")return `${count} ${count===1?"lesson":"lessons"}`;
  return `${count} ${t("lessons")}`;
}

function attendanceStatus(l){
  const value=String(l.attendance??"").trim().toLowerCase();
  if(["present","obecna","obecny","obecny/a","true"].includes(value))return "present";
  if(["absent","nieobecna","nieobecny","false"].includes(value))return "absent";
  return "unknown";
}

function attendanceLabel(l){
  return ({
    present:t("present"),
    absent:t("absent"),
    unknown:t("unspecified")
  })[attendanceStatus(l)];
}

function gradeLabel(grade){
  if(!grade)return "—";
  return UI_LANG==="ja"?`${grade}年生`:`${grade}`;
}

function lessonCard(l){
  const color=subjectById(l.subjectId)?.color||"#5147e8";
  const grade=gradeOf(l);
  const status=attendanceStatus(l);
  const statusColor=status==="present"?"#176b36":
    status==="absent"?"#a42132":"var(--muted)";

  return `<article class="lesson-card" style="--lesson-color:${esc(color)};--lesson-bg:${esc(color)}18">
    <button type="button" class="lesson-button" data-details="${esc(l.id)}">
      <span class="lesson-line">
        <span>${esc(fmtTime(l.start,l.timeZone||zone()))}</span>
        <span>${esc(lessonTitle(l))} ${lessonNumber(l)}</span>
      </span>
      <span class="lesson-meta">${grade?`${esc(gradeLabel(grade))}. `:""}${esc(t("schoolYear"))}: ${esc(schoolYear(l))}</span>
      <span class="lesson-meta" style="display:block">
        ${esc(t("attendance"))}:
        <span style="color:${statusColor}">${esc(attendanceLabel(l))}</span>
      </span>
    </button>
  </article>`;
}

function openDetails(id){
  const l=lessons.find(x=>String(x.id)===String(id));
  if(!l)return;

  const grade=gradeOf(l);
  const rows=[
    [t("subject"),subjectById(l.subjectId)?.name||t("subject")],
    [t("lessonNumber"),String(lessonNumber(l))],
    [t("dateTime"),fmtDateTime(l.start,l.timeZone||zone())],
    [t("grade"),grade?gradeLabel(grade):"—"],
    [t("schoolYear"),schoolYear(l)],
    [t("attendance"),attendanceLabel(l)],
    [t("note"),l.note||t("noNote")]
  ];

  $("lessonDetails").innerHTML=`<div class="details-grid">${
    rows.map(([label,value])=>
      `<span class="details-label">${esc(label)}</span><span>${esc(value)}</span>`
    ).join("")
  }</div>`;

  $("lessonDialog").showModal();
}

function bindDetailButtons(root){
  root.querySelectorAll("[data-details]").forEach(b=>{
    b.onclick=()=>openDetails(b.dataset.details);
  });
}

function renderWeekLessons(anchorDate){
  const monday=startOfWeek(anchorDate);
  const days=Array.from({length:7},(_,i)=>addDays(monday,i));
  const weekdayLabels=weekdayNames();
  const allItems=days.flatMap(d=>lessonsOn(dateKey(d)));

  $("weekLessonsCount").textContent=allItems.length
    ?lessonCountText(allItems.length)
    :"";

  if(!allItems.length){
    $("weekLessons").innerHTML=
      `<div class="empty">${esc(t("noLessonsThisWeek"))}</div>`;
    return;
  }

  $("weekLessons").innerHTML=days.map((d,i)=>{
    const dayLessons=lessonsOn(dateKey(d));
    const title=`${weekdayLabels[i]}, ${fmtCalendarDate(d,{
      month:"long",
      day:"numeric"
    })}`;

    return `<section class="day-card">
      <div class="day-card-head">
        <b>${esc(title)}</b>
        <span class="muted">${dayLessons.length?lessonCountText(dayLessons.length):""}</span>
      </div>
      ${dayLessons.map(lessonCard).join("")||
        `<div class="muted">${esc(t("noLessons"))}</div>`}
    </section>`;
  }).join("");

  bindDetailButtons($("weekLessons"));
}

function renderMonth(){
  const first=new Date(cursor.getFullYear(),cursor.getMonth(),1);
  const start=new Date(first);
  start.setDate(first.getDate()-((first.getDay()+6)%7));

  $("periodLabel").textContent=fmtCalendarDate(cursor,{
    month:"long",
    year:"numeric"
  });

  const weekdays=weekdayNames();
  let html=`<div class="weekdays">${weekdays.map(x=>
    `<div class="weekday">${esc(x)}</div>`
  ).join("")}</div><div class="month-grid">`;

  for(let i=0;i<42;i++){
    const d=addDays(start,i);
    const key=dateKey(d);
    const items=lessonsOn(key);

    const classes=[
      "month-day",
      d.getMonth()!==cursor.getMonth()?"outside":"",
      key===dateKey(selectedDate)?"selected":"",
      key===dateKey(todayLocal())?"today":""
    ].filter(Boolean).join(" ");

    html+=`<div class="${classes}">
      <div class="day-head">
        <button class="day-num" type="button" data-pick="${key}"
          aria-label="${esc(t("selectDay"))} ${esc(key)}">${d.getDate()}</button>
      </div>
      <div class="month-events">`;

html += items.map((l, index) => {
  const color = subjectById(l.subjectId)?.color || "#5147e8";
  const hidden = index >= 3 ? " hidden" : "";

  return `<button
    type="button"
    class="month-event${hidden}"
    data-details="${esc(l.id)}"
    style="--event-color:${esc(color)};--event-bg:${esc(color)}18"
  >
    ${esc(fmtTime(l.start, l.timeZone || zone()))} ${esc(lessonTitle(l))}
  </button>`;
}).join("");

if (items.length > 3) {
  html += `<button type="button" class="more-events" data-expand-month>
    +${items.length - 3} ${esc(t("more"))}
  </button>`;
}

    if(items.length>3){
      html+=`<span class="more-events">+${items.length-3} ${esc(t("more"))}</span>`;
    }

    html+="</div></div>";
  }

  $("monthView").innerHTML=html+"</div>";
$("monthView").querySelectorAll("[data-expand-month]").forEach(button => {
  button.onclick = () => {
    const day = button.closest(".month-day");
    day.querySelectorAll(".month-event.hidden").forEach(event => {
      event.classList.remove("hidden");
    });
    button.remove();
  };
});

  $("monthView").querySelectorAll("[data-pick]").forEach(b=>{
    b.onclick=()=>{
      selectedDate=fromKey(b.dataset.pick);
      weekLessonsDate=new Date(selectedDate);
      renderAll();
    };
  });

  bindDetailButtons($("monthView"));
}

function renderWeek(){
  const monday=startOfWeek(cursor);
  const days=Array.from({length:7},(_,i)=>addDays(monday,i));
  const end=days[6];
  const weekdays=weekdayNames();

  $("periodLabel").textContent=
    `${fmtCalendarDate(monday,{day:"numeric",month:"short"})} – `+
    `${fmtCalendarDate(end,{day:"numeric",month:"short",year:"numeric"})}`;

  let headers='<div class="week-head"></div>';
  days.forEach((d,i)=>{
    headers+=`<div class="week-head">${esc(weekdays[i])}<br>${d.getDate()}.${d.getMonth()+1}</div>`;
  });

  let axis='<div class="time-axis">';
  for(let h=0;h<24;h++){
    axis+=`<span class="hour-label" style="top:${h*48}px">${pad(h)}:00</span>`;
  }
  axis+="</div>";

  let columns="";
  days.forEach(d=>{
    let events="";

    lessonsOn(dateKey(d)).forEach(l=>{
      const p=parts(new Date(l.start),l.timeZone||zone());
      const top=(Number(p.hour)*60+Number(p.minute))/60*48;
      const color=subjectById(l.subjectId)?.color||"#5147e8";

      events+=`<button type="button" class="week-event" data-details="${esc(l.id)}"
        style="top:${top}px;--event-color:${esc(color)};--event-bg:${esc(color)}18">
        <strong>${esc(fmtTime(l.start,l.timeZone||zone()))} ${esc(lessonTitle(l))}</strong>
        <span>${esc(schoolYear(l))}</span>
      </button>`;
    });

    columns+=`<div class="week-column">${events}</div>`;
  });

  $("weekView").innerHTML=
    `<div class="week-scroll"><div class="week-grid">${headers}${axis}${columns}</div></div>`;

  bindDetailButtons($("weekView"));
}

/* Zakładka obecności */
function populateSubjectFilter(){
  const select=$("attendanceSubjectFilter");
  const previous=select.value;
  const usableSubjects=subjects.filter(s=>
    lessons.some(l=>String(l.subjectId)===String(s.id))
  );

  select.innerHTML=
    `<option value="">${esc(t("chooseSubject"))}</option>`+
    usableSubjects.map(s=>
      `<option value="${esc(s.id)}">${esc(s.name||t("subject"))}</option>`
    ).join("");

  if(usableSubjects.some(s=>String(s.id)===previous)){
    select.value=previous;
  }else if(usableSubjects.length){
    select.value=String(usableSubjects[0].id);
  }
}

function gradesForSubject(subjectId){
  if(!subjectId)return [];

  const year=currentSchoolYear();
  const found=new Set();

  lessons.forEach(l=>{
    if(String(l.subjectId)!==String(subjectId)||schoolYear(l)!==year)return;
    const grade=gradeOf(l);
    if(grade)found.add(Number(grade));
  });

  const subject=subjectById(subjectId);
  subject?.yearPlans?.forEach(plan=>{
    if(String(plan.schoolYear)===year&&Number(plan.grade)){
      found.add(Number(plan.grade));
    }
  });

  return [...found].sort((a,b)=>a-b);
}

function populateGradeFilter(preferredGrade){
  const select=$("attendanceGradeFilter");
  const subjectId=$("attendanceSubjectFilter").value;
  const grades=gradesForSubject(subjectId);

  select.innerHTML=
    `<option value="">${esc(t("chooseGrade"))}</option>`+
    grades.map(g=>
      `<option value="${g}">${g} ${esc(t("grade").toLowerCase())}</option>`
    ).join("");

  if(preferredGrade&&grades.includes(Number(preferredGrade))){
    select.value=String(preferredGrade);
  }else if(grades.length){
    select.value=String(grades[0]);
  }else{
    select.value="";
  }
}

function renderAttendance(){
  const subjectId=$("attendanceSubjectFilter").value;
  const gradeValue=$("attendanceGradeFilter").value;
  const year=currentSchoolYear();

  if(!subjectId||!gradeValue){
    $("attendanceFilterHint").textContent=t("attendanceHint");
    $("overallStats").innerHTML="";
    $("attendanceBody").innerHTML="";
    return;
  }

  const selectedLessons=lessons
    .filter(l=>
      String(l.subjectId)===String(subjectId)&&
      schoolYear(l)===year&&
      Number(gradeOf(l))===Number(gradeValue)
    )
    .sort((a,b)=>new Date(a.start)-new Date(b.start));

  const present=selectedLessons.filter(l=>attendanceStatus(l)==="present").length;
  const absent=selectedLessons.filter(l=>attendanceStatus(l)==="absent").length;
  const unknown=selectedLessons.length-present-absent;
  const recorded=present+absent;
  const rate=recorded?Math.round(present/recorded*100):0;

  $("attendanceFilterHint").textContent=
    `${t("subject")}: ${subjectById(subjectId)?.name||""} · `+
    `${t("grade")}: ${gradeValue} · ${t("schoolYear")}: ${year}`;

  const stats=[
    [t("lessonsCount"),selectedLessons.length],
    [t("presentCount"),present],
    [t("absentCount"),absent],
    [t("unknownCount"),unknown],
    [t("frequency"),`${rate}%`]
  ];

  $("overallStats").innerHTML=stats.map(([label,value])=>
    `<div class="stat">${esc(label)}<span class="stat-value">${esc(value)}</span></div>`
  ).join("");

  if(!selectedLessons.length){
    $("attendanceBody").innerHTML=
      `<tr><td colspan="5" class="muted">${esc(t("noAttendanceRows"))}</td></tr>`;
    return;
  }

  $("attendanceBody").innerHTML=selectedLessons.map(l=>{
    const status=attendanceStatus(l);
    const statusClass=status==="present"?"attendance-present":
      status==="absent"?"attendance-absent":"attendance-unknown";

    return `<tr>
      <td>${lessonNumber(l)}</td>
      <td>${esc(lessonTitle(l))}</td>
      <td>${esc(gradeLabel(gradeOf(l)))}</td>
      <td>${esc(schoolYear(l))}</td>
      <td><span class="${statusClass}">${esc(attendanceLabel(l))}</span></td>
    </tr>`;
  }).join("");
}

function showPanel(panel){
  const isCalendar=panel==="calendar";
  $("calendarPanel").classList.toggle("hidden",!isCalendar);
  $("attendancePanel").classList.toggle("hidden",isCalendar);
  $("calendarTabBtn").classList.toggle("active",isCalendar);
  $("attendanceTabBtn").classList.toggle("active",!isCalendar);
}

function renderAll(){
  rebuildIndexes();

  $("monthView").classList.toggle("hidden",mode!=="month");
  $("weekView").classList.toggle("hidden",mode!=="week");
  $("monthBtn").classList.toggle("active",mode==="month");
  $("weekBtn").classList.toggle("active",mode==="week");

  if(mode==="month"){
    renderMonth();
  }else{
    renderWeek();
  }

  renderWeekLessons(weekLessonsDate);
}

async function loadJson(path,fallback){
  try{
    const response=await fetch(path);
    if(!response.ok)throw new Error(`Nie można wczytać ${path}`);
    return await response.json();
  }catch(error){
    console.warn(error);
    return fallback;
  }
}

async function loadFreshJson(path) {
  const url = new URL(path, document.baseURI);
  url.searchParams.set("_refresh", String(Date.now()));

  const response = await fetch(url.toString(), { cache: "no-store" });
  if (!response.ok) {
    throw new Error(`Nie można wczytać ${path}`);
  }

  return response.json();
}

let refreshInProgress = false;

async function refreshJsonData() {
  if (refreshInProgress) return;
  refreshInProgress = true;

  try {
    const previousGrade = $("attendanceGradeFilter").value;

    const [newSubjects, newLessons, newSettings] = await Promise.all([
      loadFreshJson("./data/subjects.json"),
      loadFreshJson("./data/lessons.json"),
      loadFreshJson("./data/settings.json")
    ]);

    if (!Array.isArray(newSubjects) || !Array.isArray(newLessons)) {
      throw new Error("Nieprawidłowy format plików JSON");
    }

    subjects = newSubjects;
    lessons = newLessons;
    settings = newSettings && typeof newSettings === "object"
      ? newSettings
      : { displayTimeZone: DEFAULT_ZONE };

    if (!settings.displayTimeZone) {
      settings.displayTimeZone = DEFAULT_ZONE;
    }

    rebuildIndexes();
    populateSubjectFilter();
    populateGradeFilter(previousGrade);
    renderAll();
    renderAttendance();
  } catch (error) {
    // Jeśli pobranie się nie powiedzie, pozostawiamy dotychczasowe dane.
    console.warn("Nie udało się odświeżyć danych kalendarza:", error);
  } finally {
    refreshInProgress = false;
  }
}

        
/* Nawigacja kalendarza */
$("prevBtn").onclick=()=>{
  if(mode==="month"){
    cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);
    selectedDate=new Date(cursor);
    weekLessonsDate=new Date(selectedDate);
  }else{
    cursor=addDays(cursor,-7);
    selectedDate=new Date(cursor);
    weekLessonsDate=new Date(cursor);
  }
  renderAll();
};

$("nextBtn").onclick=()=>{
  if(mode==="month"){
    cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);
    selectedDate=new Date(cursor);
    weekLessonsDate=new Date(selectedDate);
  }else{
    cursor=addDays(cursor,7);
    selectedDate=new Date(cursor);
    weekLessonsDate=new Date(cursor);
  }
  renderAll();
};

$("todayBtn").onclick=()=>{
  const today=todayLocal();
  cursor=new Date(today);
  selectedDate=new Date(today);
  weekLessonsDate=new Date(today);
  renderAll();
};

/*
  Przy każdym przełączeniu widoku ustawiamy:
  - kalendarz na dzisiejszą datę,
  - zaznaczenie na dzisiejszą datę,
  - listę lekcji na bieżący tydzień.
*/
$("monthBtn").onclick=()=>{
  const today=todayLocal();
  cursor=new Date(today);
  selectedDate=new Date(today);
  weekLessonsDate=new Date(today);
  mode="month";
  renderAll();
};

$("weekBtn").onclick=()=>{
  const today=todayLocal();
  cursor=new Date(today);
  selectedDate=new Date(today);
  weekLessonsDate=new Date(today);
  mode="week";
  renderAll();
};

/* Główne zakładki i filtry obecności */
$("calendarTabBtn").onclick=()=>showPanel("calendar");

$("attendanceTabBtn").onclick=()=>{
  showPanel("attendance");
  renderAttendance();
};

$("attendanceSubjectFilter").addEventListener("change",()=>{
  populateGradeFilter();
  renderAttendance();
});

$("attendanceGradeFilter").addEventListener("change",renderAttendance);

$("closeDialogBtn").onclick=()=>$("lessonDialog").close();

$("lessonDialog").addEventListener("click",event=>{
  if(event.target===$("lessonDialog"))$("lessonDialog").close();
});

async function start(){
  const [loadedSubjects,loadedLessons,loadedSettings]=await Promise.all([
    loadJson("./data/subjects.json",[]),
    loadJson("./data/lessons.json",[]),
    loadJson("./data/settings.json",{displayTimeZone:DEFAULT_ZONE})
  ]);

  subjects=Array.isArray(loadedSubjects)?loadedSubjects:[];
  lessons=Array.isArray(loadedLessons)?loadedLessons:[];
  settings=loadedSettings&&typeof loadedSettings==="object"
    ?loadedSettings
    :{displayTimeZone:DEFAULT_ZONE};

  if(!settings.displayTimeZone)settings.displayTimeZone=DEFAULT_ZONE;

  rebuildIndexes();

  const currentYear=currentSchoolYear();
  const currentGrade=subjects
    .flatMap(s=>(s.yearPlans||[])
      .filter(p=>String(p.schoolYear)===currentYear)
      .map(p=>Number(p.grade)))
    .filter(Boolean)
    .sort((a,b)=>a-b)[0];

  populateSubjectFilter();
  populateGradeFilter(currentGrade);
  renderAll();
  renderAttendance();

  $("loadMessage").textContent=lessons.length
    ?t("readOnly")
    :t("loadError");

  window.setInterval(refreshJsonData, 60_000);

}

start();
})();
</script>
