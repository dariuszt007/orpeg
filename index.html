<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<title>Kalendarz lekcji</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#202437;--muted:#687087;--line:#e2e5ed;--primary:#5147e8;--soft:#eeedff;--green:#168451;--red:#bd3045;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}
button{min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);cursor:pointer;touch-action:manipulation}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff}button.danger{color:var(--red)}button.active{background:var(--soft);color:var(--primary)}
input,select,textarea{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text)}
input[type=checkbox]{width:20px;min-height:20px}input[type=color]{padding:4px}textarea{min-height:85px}
label{display:block;margin:8px 0 5px;color:var(--muted);font-size:13px}h1,h2,h3{margin:0 0 10px}h1{font-size:clamp(21px,5vw,28px)}h2{font-size:20px}h3{font-size:16px}
.app{max-width:1000px;margin:auto;padding:14px}.topbar,.toolbar,.row,.actions{display:flex;align-items:center;gap:8px}.topbar{justify-content:space-between;margin-bottom:14px}
.toolbar{flex-wrap:wrap;margin-bottom:12px}.period{flex:1;text-align:center;font-weight:700}.views{display:flex;gap:5px}
.card,.calendar{background:var(--card);border:1px solid var(--line);border-radius:15px}.calendar{overflow:hidden}
.weekdays,.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekday{padding:8px 2px;text-align:center;color:var(--muted);background:#fafaff;border-bottom:1px solid var(--line);font-size:12px}
.month-day{min-width:0;min-height:76px;padding:4px 3px;display:flex;flex-direction:column;gap:3px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;background:#fff}
.month-day:nth-child(7n){border-right:0}.month-day.outside{background:#fafbfe;color:#a3a8b5}.month-day.selected{background:var(--soft)}.month-day.today .day-num{background:var(--primary);color:#fff}
.day-head{display:flex;justify-content:space-between;align-items:center}.day-num,.add-day{min-height:26px;width:28px;padding:0;border:0;background:transparent}.day-num{border-radius:50%;font-weight:700}.add-day{color:var(--primary);font-size:19px}
.month-events{display:grid;gap:3px}.month-event{width:100%;min-height:21px;overflow:hidden;padding:3px;border:0;border-left:3px solid var(--event-color,var(--primary));border-radius:4px;background:color-mix(in srgb,var(--event-color,var(--primary)) 16%,white);text-align:left;font-size:10px;font-weight:700;white-space:nowrap;text-overflow:ellipsis}
.section-heading{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 9px}.section-heading h2{margin:0}.event-list,.week-days{display:grid;gap:8px}
.day-card{padding:11px;border:1px solid var(--line);border-radius:13px;background:#fff}.day-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.lesson-card{padding:9px;border-left:6px solid var(--lesson-color,var(--primary));border-radius:9px;background:color-mix(in srgb,var(--lesson-color,var(--primary)) 9%,white)}
.lesson-main{width:100%;min-height:36px;padding:0;border:0;background:transparent;text-align:left}.lesson-line{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.muted{color:var(--muted);font-size:13px}.attendance{margin-top:6px}.hidden{display:none!important}.empty{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
.week-scroll{overflow:auto;border-radius:12px;background:#fff}.week-grid{display:grid;grid-template-columns:48px repeat(7,128px);min-width:944px}
.week-head{position:sticky;top:0;z-index:2;min-height:48px;padding:6px;border:1px solid var(--line);background:#fafaff;text-align:center;font-size:12px}
.time-axis,.week-column{position:relative;height:1344px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 55px,var(--line) 55px,var(--line) 56px)}
.time-axis{position:sticky;left:0;z-index:1;background-color:#fafaff}.hour-label{position:absolute;right:3px;transform:translateY(-7px);color:var(--muted);font-size:10px}
.week-column{border-right:1px solid var(--line);background-color:#fff}.week-event{position:absolute;left:3px;right:3px;height:42px;overflow:hidden;padding:4px;border:0;border-left:4px solid var(--event-color,var(--primary));border-radius:6px;background:color-mix(in srgb,var(--event-color,var(--primary)) 18%,white);text-align:left;font-size:10px}
.week-event strong,.week-event span{display:block}.month-event,.week-event,.lesson-main{touch-action:none;cursor:grab}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;padding:8px 10px;border-left:5px solid var(--drag-color,var(--primary));border-radius:8px;background:#fff;box-shadow:0 5px 20px #0003;font-size:13px;font-weight:700;transform:translate(10px,10px)}
.drag-over{outline:3px dashed var(--primary)!important;outline-offset:-4px;background-color:var(--soft)!important}
.week-drop-preview{position:absolute;z-index:10;left:3px;right:3px;min-height:42px;pointer-events:none;padding:5px;border:2px dashed var(--primary);border-radius:7px;background:#eeedffdd;color:#3029a8;font-size:11px;font-weight:700}
.admin-card{margin:12px 0;padding:14px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}.stat{padding:9px;border-radius:9px;background:#f5f6fb;font-size:13px}
.subject-row,.lesson-admin-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.subject-row:last-child,.lesson-admin-row:last-child{border-bottom:0}
.row-info{min-width:0;overflow-wrap:anywhere}.row-actions{display:flex;gap:5px;flex-shrink:0}.row-actions button{min-height:36px;padding:5px 8px}.lesson-row-main{display:flex;align-items:center;gap:9px;min-width:0}
.bulk-actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:9px 0}.bulk-select-label{display:flex;align-items:center;gap:7px;margin:0}.bulk-select-label input{width:20px;min-height:20px}
.export-subject-list{display:grid;gap:5px;margin-top:6px}.export-subject-option{display:flex;align-items:center;gap:8px;margin:0;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:white}.export-subject-option input{flex:0 0 20px;width:20px;min-height:20px;margin:0}.export-subject-option span{color:var(--text)}
.table-wrap{overflow:auto}table{width:100%;min-width:420px;border-collapse:collapse}th,td{padding:8px;border:1px solid #ddd;text-align:left;font-size:14px}th{background:#f1f2f6}
dialog{width:min(540px,calc(100% - 20px));max-height:88vh;overflow:auto;padding:17px;border:1px solid var(--line);border-radius:16px}dialog::backdrop{background:#13172788}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.check-row{display:flex;align-items:center;gap:8px}.check-row input{width:20px;min-height:20px}
@media(min-width:720px){.app{padding:22px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:430px){.app{padding:9px}.month-day{min-height:65px;padding:3px 2px}.month-event{font-size:9px}.form-grid{grid-template-columns:1fr;gap:3px}.subject-row,.lesson-admin-row{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1 data-i18n="appTitle">Kalendarz lekcji</h1>
    <button id="adminToggle" class="primary" data-i18n="admin">Panel Admin</button>
  </header>

  <main id="calendarView">
    <div class="toolbar">
      <button id="prevBtn" data-i18n="back">Wstecz</button>
      <button id="todayBtn" data-i18n="today">Dziś</button>
      <button id="nextBtn" data-i18n="next">Dalej</button>
      <div id="periodLabel" class="period"></div>
      <div class="views">
        <button id="monthBtn" class="active" data-i18n="month">Miesiąc</button>
        <button id="weekBtn" data-i18n="week">Tydzień</button>
      </div>
    </div>
    <section id="monthView" class="calendar"></section>
    <section id="monthAgenda">
      <div class="section-heading"><h2 id="selectedDateTitle"></h2><span id="selectedDateCount" class="muted"></span></div>
      <div id="selectedDayLessons" class="event-list"></div>
    </section>
    <section id="weekView" class="hidden"></section>
    <p id="loadMessage" class="muted"></p>
  </main>

  <main id="adminView" class="hidden">
    <div class="row" style="justify-content:space-between"><h2 data-i18n="admin">Panel Admin</h2><button id="backCalendarBtn" data-i18n="calendar">Kalendarz</button></div>

    <section class="card admin-card">
      <h3 id="subjectFormTitle" data-i18n="addSubject">Dodaj przedmiot</h3>
      <input id="subjectId" type="hidden">
      <div class="form-grid">
        <div><label for="subjectName" data-i18n="subjectName">Nazwa przedmiotu</label><input id="subjectName" maxlength="60"></div>
        <div><label for="subjectColor" data-i18n="color">Kolor</label><input id="subjectColor" type="color" value="#5147e8"></div>
        <div><label for="subjectPlanned" data-i18n="plannedLessons">Plan lekcji na rok szkolny</label><input id="subjectPlanned" type="number" min="0" value="0"></div>
        <div><label for="subjectGrade" data-i18n="grade">Klasa</label>
          <select id="subjectGrade"><option value="" data-i18n="unassigned">Nieprzypisana</option>
            <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
            <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
          </select>
        </div>
      </div>
      <div class="actions" style="margin-top:10px"><button id="saveSubjectBtn" class="primary" data-i18n="addSubject">Dodaj przedmiot</button><button id="cancelSubjectEditBtn" class="hidden" data-i18n="cancel">Anuluj</button></div>
      <div id="subjectList"></div>
    </section>

    <section class="card admin-card">
      <h3 data-i18n="timezoneTitle">Strefa czasowa</h3>
      <label for="displayZone" data-i18n="timezoneLabel">Strefa wyświetlania</label>
      <select id="displayZone"></select>
      <button id="saveDisplayZoneBtn" class="primary" data-i18n="saveTimezone">Zapisz strefę</button>
      <p class="muted" data-i18n="tokyoDefault">Domyślna strefa: Tokio.</p>
    </section>

    <section class="card admin-card">
      <h3 data-i18n="attendanceTitle">Obecności</h3>
      <label for="attendanceFilter" data-i18n="attendanceFilter">Filtr przedmiotu</label>
      <select id="attendanceFilter"></select><div id="overallStats" class="stats"></div>
      <div class="table-wrap"><table>
        <thead><tr><th data-i18n="lessonNumber">Numer lekcji</th><th data-i18n="subject">Przedmiot</th><th data-i18n="attendance">Obecność</th></tr></thead>
        <tbody id="attendanceBody"></tbody>
      </table></div>
    </section>

    <section class="card admin-card">
      <h3 data-i18n="allLessons">Wszystkie lekcje</h3>
      <div class="bulk-actions">
        <label class="bulk-select-label"><input id="selectAllLessons" type="checkbox"><span data-i18n="selectAll">Zaznacz wszystkie lekcje</span></label>
        <button id="deleteSelectedLessonsBtn" class="danger" disabled data-i18n="deleteSelected">Usuń wybrane lekcje</button>
      </div>
      <div id="adminLessonList"></div>
    </section>

    <section class="card admin-card">
      <h3 data-i18n="icsTitle">Import i eksport ICS</h3>
      <h4 data-i18n="exportRangeTitle">Zakres eksportu</h4>
      <div class="form-grid">
        <div><label for="exportStartDate" data-i18n="exportFrom">Od dnia</label><input id="exportStartDate" type="date"></div>
        <div><label for="exportEndDate" data-i18n="exportTo">Do dnia</label><input id="exportEndDate" type="date"></div>
      </div>
      <label class="bulk-select-label" style="margin-top:10px"><input id="exportAllSubjects" type="checkbox" checked><span data-i18n="exportAll">Wszystkie przedmioty i klasy</span></label>
      <label data-i18n="exportChoose">Albo wybierz przedmioty i klasy:</label>
      <div id="exportSubjectChoices"></div>
      <div class="actions" style="margin-top:12px"><button id="exportIcsBtn" data-i18n="exportIcs">Eksportuj ICS</button></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <h4 data-i18n="importHeading">Import kalendarza ICS</h4>
      <div class="actions"><input id="icsFile" type="file" accept=".ics,text/calendar"><button id="importIcsBtn" data-i18n="importIcs">Importuj ICS</button></div>
      <p id="icsMessage" class="muted" aria-live="polite"></p>
    </section>

    <section class="card admin-card">
      <h3 data-i18n="saveRepo">Zapis do repozytorium</h3>
      <p class="muted" data-i18n="repoHint">Skopiuj JSON-y do repozytorium, aby zachować zmiany.</p>
      <label>data/subjects.json</label><textarea id="subjectsJson" readonly></textarea><button class="copyJson" data-target="subjectsJson" data-i18n="copySubjects">Kopiuj JSON przedmiotów</button>
      <label>data/lessons.json</label><textarea id="lessonsJson" readonly></textarea><button class="copyJson" data-target="lessonsJson" data-i18n="copyLessons">Kopiuj JSON lekcji</button>
      <label>data/settings.json</label><textarea id="settingsJson" readonly></textarea><button class="copyJson" data-target="settingsJson" data-i18n="copySettings">Kopiuj JSON ustawień</button>
    </section>
  </main>
</div>

<dialog id="lessonDialog">
  <form id="lessonForm">
    <h2 id="lessonFormTitle"></h2><input id="lessonId" type="hidden"><input id="lessonDate" type="hidden">
    <label for="lessonSubject" data-i18n="subject">Przedmiot</label><select id="lessonSubject" required></select>
    <div class="form-grid">
      <div><label for="lessonTime" data-i18n="startTime">Godzina rozpoczęcia</label><input id="lessonTime" type="time" required></div>
      <div><label for="eventZone" data-i18n="eventTimezone">Strefa czasowa lekcji</label><select id="eventZone"></select></div>
    </div>
    <div id="firstLessonArea">
      <label class="check-row"><input id="isFirstLesson" type="checkbox"><span data-i18n="newGradeFirst">Pierwsza lekcja nowej klasy / rocznika</span></label>
      <div id="classArea" class="hidden">
        <label for="schoolClass" data-i18n="grade">Klasa</label>
        <select id="schoolClass"><option value="" data-i18n="chooseGrade">Wybierz klasę</option>
          <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
          <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
        </select>
        <label for="schoolYearLessonCount" data-i18n="yearPlan">Liczba lekcji w roku szkolnym</label><input id="schoolYearLessonCount" type="number" min="1" value="20">
      </div>
    </div>
    <label for="lessonAttendance" data-i18n="attendance">Obecność</label>
    <select id="lessonAttendance"><option value="unknown" data-i18n="unknown">Nieustalona</option><option value="present" data-i18n="present">Obecny</option><option value="absent" data-i18n="absent">Nieobecny</option></select>
    <label for="lessonAlarms" data-i18n="alarm">Alarm przed lekcją</label>
    <select id="lessonAlarms"><option value="5" selected data-i18n="alarm5">5 minut</option><option value="10" data-i18n="alarm10">10 minut</option><option value="15" data-i18n="alarm15">15 minut</option><option value="30" data-i18n="alarm30">30 minut</option><option value="60" data-i18n="alarm60">1 godzina</option></select>
    <label for="lessonNote" data-i18n="note">Notatka</label><textarea id="lessonNote" maxlength="1000"></textarea>
    <div class="dialog-actions"><button id="cancelLessonBtn" type="button" data-i18n="cancel">Anuluj</button><button class="primary" type="submit" data-i18n="save">Zapisz</button></div>
  </form>
</dialog>

function installDragging(){

 document.addEventListener("pointermove",e=>{if(!dragState||e.pointerId!==dragState.pointer)return;dragState.x=e.clientX;dragState.y=e.clientY;if(dragState.type==="mouse"&&!dragState.started&&Math.hypot(e.clientX-dragState.sx,e.clientY-dragState.sy)>6)beginDrag();if(!dragState.started)return;e.preventDefault();if(dragGhost){dragGhost.style.left=`${e.clientX}px`;dragGhost.style.top=`${e.clientY}px`;}updatePreview(e.clientX,e.clientY);},{passive:false});
 document.addEventListener("pointerup",e=>{if(!dragState||e.pointerId!==dragState.pointer)return;clearTimeout(dragTimer);if(dragState.started){const target=findDrop(e.clientX,e.clientY);if(target)moveLesson(dragState.id,target,e.clientY);suppressClickUntil=Date.now()+500;}stopDrag();});
 document.addEventListener("pointercancel",stopDrag);
 document.addEventListener("click",e=>{if(Date.now()<suppressClickUntil&&e.target.closest("[data-edit-lesson]")){e.preventDefault();e.stopImmediatePropagation();}},true);
}
function unusedColor(){const used=new Set(subjects.map(s=>(s.color||"").toLowerCase()));const c=palette.find(x=>!used.has(x.toLowerCase()));if(c)return c;for(let h=0;h<360;h+=17){const x=`hsl(${h} 68% 45%)`;if(!used.has(x.toLowerCase()))return x;}let x;do{x="#"+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,"0");}while(used.has(x));return x;}
function icsEscape(s){return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");}
function icsTime(iso){return new Date(iso).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");}
function exportIcs(){
 const from=$("exportStartDate").value,to=$("exportEndDate").value,all=$("exportAllSubjects").checked;
 if(!from||!to){$("icsMessage").textContent=T.chooseRange;return;}if(from>to){$("icsMessage").textContent=T.invalidRange;return;}
 const chosen=new Set([...document.querySelectorAll("[data-export-subject]:checked")].map(x=>x.value));
 if(!all&&!chosen.size){$("icsMessage").textContent=T.chooseSubjects;return;}
 const list=lessons.filter(l=>{const d=dateInZone(l.start);return d>=from&&d<=to&&(all||chosen.has(l.subjectId));});
 if(!list.length){$("icsMessage").textContent=T.noMatches;return;}
 const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Lesson Calendar//","CALSCALE:GREGORIAN"];
 list.forEach(l=>{const title=lessonTitle(l);lines.push("BEGIN:VEVENT",`UID:${icsEscape(l.uid||l.id)}@calendar`,`DTSTAMP:${icsTime(new Date().toISOString())}`,`DTSTART:${icsTime(l.start)}`,`DTEND:${icsTime(new Date(new Date(l.start).getTime()+45*60000).toISOString())}`,`SUMMARY:${icsEscape(title)}`);(l.alarms||[]).forEach(a=>lines.push("BEGIN:VALARM",`TRIGGER:-PT${Math.max(0,+a||0)}M`,"ACTION:DISPLAY",`DESCRIPTION:${icsEscape(title)}`,"END:VALARM"));lines.push("END:VEVENT");});
 lines.push("END:VCALENDAR");const url=URL.createObjectURL(new Blob([lines.join("\r\n")],{type:"text/calendar;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download=`lessons-${from}-${to}.ics`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$("icsMessage").textContent=`${T.exported}: ${list.length}`;
}
function parseIcsProps(block){const out={};block.split(/\r?\n/).forEach(line=>{const i=line.indexOf(":");if(i<0)return;const left=line.slice(0,i).split(";"),params={};left.slice(1).forEach(x=>{const j=x.indexOf("=");if(j>0)params[x.slice(0,j).toUpperCase()]=x.slice(j+1).replace(/^"|"$/g,"");});out[left[0].toUpperCase()]={value:line.slice(i+1),params};});return out;}
function parseIcsDate(prop){if(!prop?.value)return null;const v=prop.value,tz=prop.params?.TZID||zone();if(/^\d{8}T\d{6}Z$/.test(v))return new Date(Date.UTC(+v.slice(0,4),+v.slice(4,6)-1,+v.slice(6,8),+v.slice(9,11),+v.slice(11,13),+v.slice(13,15))).toISOString();if(/^\d{8}T\d{6}$/.test(v))return zonedIso(`${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`,`${v.slice(9,11)}:${v.slice(11,13)}`,tz);if(/^\d{8}$/.test(v))return zonedIso(`${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`,"09:00",tz);return null;}
function findOrCreateSubject(title){const existing=[...subjects].sort((a,b)=>b.name.length-a.name.length).find(s=>title.toLowerCase().startsWith((s.name+" ").toLowerCase()));if(existing)return existing;const base=(title.match(/^(.*?)[\s_-]+\d+$/)?.[1]||title).trim()||T.noSubject;let s=subjects.find(x=>x.name.toLowerCase()===base.toLowerCase());if(!s){s={id:uid(),name:base,color:unusedColor(),plannedCount:0,grade:null};subjects.push(s);}return s;}
async function importIcs(){const file=$("icsFile").files[0];if(!file){$("icsMessage").textContent=T.chooseFile;return;}try{const text=(await file.text()).replace(/\r?\n[ \t]/g,""),blocks=text.match(/BEGIN:VEVENT[\s\S]*?END:VEVENT/gi)||[],known=new Set(lessons.map(l=>l.uid).filter(Boolean)),added=[];for(const block of blocks){const p=parseIcsProps(block),start=parseIcsDate(p.DTSTART);if(!start)continue;const eventUid=p.UID?.value||"";if(eventUid&&known.has(eventUid))continue;const title=String(p.SUMMARY?.value||T.noSubject).replace(/\\n/gi,"\n").replace(/\\,/g,",").replace(/\\;/g,";").replace(/\\\\/g,"\\");const s=findOrCreateSubject(title);const alarms=[...block.matchAll(/TRIGGER\s*[:=]\s*-?PT(\d+)M/gi)].map(x=>+x[1]);added.push({id:uid(),uid:eventUid,subjectId:s.id,start,timeZone:p.DTSTART?.params?.TZID||zone(),attendance:"unknown",alarms,note:""});if(eventUid)known.add(eventUid);}if(!added.length){$("icsMessage").textContent=T.noImported;return;}lessons.push(...added);renderAll();$("icsFile").value="";$("icsMessage").textContent=`${added.length} ${T.imported}`;}catch(e){console.error(e);$("icsMessage").textContent=T.importError;}}
async function loadJson(path,fallback){try{const r=await fetch(path);if(!r.ok)throw Error();return await r.json();}catch{return fallback;}}
async function copyJson(id){try{await navigator.clipboard.writeText($(id).value);alert(T.copied);}catch{$(id).select();document.execCommand("copy");alert(T.copied);}}
function renderExportChoices(){const box=$("exportSubjectChoices"),selected=new Set([...box.querySelectorAll("[data-export-subject]:checked")].map(x=>x.value)),had=box.querySelectorAll("[data-export-subject]").length>0;box.innerHTML=`<div class="export-subject-list">${subjects.map(s=>`<label class="export-subject-option"><input type="checkbox" data-export-subject value="${esc(s.id)}" ${had&&selected.has(s.id)?"checked":""}><span>${esc(subjectName(s))}</span></label>`).join("")||`<span class="muted">${T.noSubject}</span>`}</div>`;box.querySelectorAll("[data-export-subject]").forEach(c=>{c.disabled=$("exportAllSubjects").checked;c.onchange=()=>{if(c.checked)$("exportAllSubjects").checked=false;renderExportChoices();};});}
$("prevBtn").onclick=()=>{if(mode==="month")cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);else cursor.setDate(cursor.getDate()-7);selectedDate=new Date(cursor);renderAll();};
$("nextBtn").onclick=()=>{if(mode==="month")cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);else cursor.setDate(cursor.getDate()+7);selectedDate=new Date(cursor);renderAll();};
$("todayBtn").onclick=()=>{cursor=new Date();cursor.setHours(0,0,0,0);selectedDate=new Date(cursor);renderAll();};
$("monthBtn").onclick=()=>{mode="month";renderCalendar();};$("weekBtn").onclick=()=>{mode="week";renderCalendar();};
$("adminToggle").onclick=()=>{$("calendarView").classList.add("hidden");$("adminView").classList.remove("hidden");renderAdmin();};
$("backCalendarBtn").onclick=()=>{$("adminView").classList.add("hidden");$("calendarView").classList.remove("hidden");renderAll();};
$("saveSubjectBtn").onclick=saveSubject;$("cancelSubjectEditBtn").onclick=resetSubject;$("attendanceFilter").onchange=renderAdmin;
$("saveDisplayZoneBtn").onclick=()=>{settings.displayTimeZone=$("displayZone").value||defaultZone;renderAll();};
$("lessonSubject").onchange=updateFirst;$("isFirstLesson").onchange=updateFirst;$("lessonForm").onsubmit=saveLesson;$("cancelLessonBtn").onclick=()=>$("lessonDialog").close();
$("exportIcsBtn").onclick=exportIcs;$("importIcsBtn").onclick=importIcs;
$("exportAllSubjects").onchange=renderExportChoices;
$("selectAllLessons").onchange=()=>{if($("selectAllLessons").checked)lessons.forEach(l=>selectedLessonIds.add(l.id));else selectedLessonIds.clear();renderAdmin();};
$("deleteSelectedLessonsBtn").onclick=()=>{if(!selectedLessonIds.size){alert(T.noneSelected);return;}if(!confirm(T.confirmMany))return;lessons=lessons.filter(l=>!selectedLessonIds.has(l.id));selectedLessonIds.clear();renderAll();};
document.querySelectorAll(".copyJson").forEach(b=>b.onclick=()=>copyJson(b.dataset.target));
async function start(){const [s,l,c]=await Promise.all([loadJson("./data/subjects.json",[]),loadJson("./data/lessons.json",[]),loadJson("./data/settings.json",{displayTimeZone:defaultZone})]);subjects=Array.isArray(s)?s:[];lessons=Array.isArray(l)?l:[];settings=c&&typeof c==="object"?c:{displayTimeZone:defaultZone};if(!settings.displayTimeZone)settings.displayTimeZone=defaultZone;const options=[...new Set([defaultZone,deviceZone,"Europe/Warsaw","Europe/London","Europe/Paris","UTC",zone()])].map(z=>`<option value="${esc(z)}">${esc(z)}</option>`).join("");$("displayZone").innerHTML=options;$("eventZone").innerHTML=options;$("displayZone").value=zone();$("eventZone").value=zone();renderAll();$("loadMessage").textContent=T.dragHint;}
installDragging();start();
})();
</script>
